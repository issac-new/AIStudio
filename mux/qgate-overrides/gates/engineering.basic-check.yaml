apiVersion: qgate/v1alpha1
kind: Gate
metadata:
  id: engineering.basic-check
  version: 0.2.0
  description: >
    G3 分支 testlog+G4 测试报告在案且全绿（退出码/计数真查，非声明）。run20 复盘 C4 覆盖件：替换模板占位命令为 scripts/qgate-checks/qgate-check.mjs
    真实执行器（simharness mux/qgate-overrides/ 供给，驱动 G5 前注入本仓）。
    证据解析序：工作树 → origin/integration/RFD-001（集成分支按纪律 71 保留至报告持久化后）。
spec:
  domain: L1
  claims:
    - engineering.lint-clean
  triggers:
    - release
  executors:
    - id: qgate-check
      type: command
      command: ["node", "scripts/qgate-checks/qgate-check.mjs", "basic-check"]
      evidenceType: g3-testlog-result
      timeoutMs: 60000
  evidence:
    required:
      - g3-testlog-result
  policy:
    failure: block
    inconclusive: warn
    allowWaiver: true
    maxAgeHours: 24
