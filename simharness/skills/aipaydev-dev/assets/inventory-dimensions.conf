# inventory-dimensions.conf — 维度枚举注册表
# 数据驱动：inventory-verify.sh source 本文件，按项目形态选取适用维度做枚举计数核验。
# 字段（每维度一个 <ID>，全大写下划线）:
#   DIM_<ID>_TITLE   维度人读名
#   DIM_<ID>_FORMS   适用项目形态（空格分隔）：backend frontend async desktop mobile lib common
#                    all = 全形态适用；common = 所有非纯库形态都适用
#   DIM_<ID>_CMD     枚举命令模板（含 ${PROJECT_DIR} 占位，inventory-verify.sh 替换后 eval）
#                    命令输出语义按 CMD 自定：find -print / grep -rl 每行一文件（按文件计数），
#                    grep -rhoE 每行一匹配（按出现次数计数，不去重）。脚本对输出行计数（grep -c .）。
#   DIM_<ID>_RM_REF  reference-manual.md 对应表锚（§<n> 或 §<n>.<sub>，空格分隔多锚取合计行数
#                    ——同维度在不同档位落不同节，如 ORM schema standard 在 §8 / lite 在 §9）
# 形态判定由 §C+.0 产出（exploration-guide.md）；脚本读生成产物 conf 的 PROJECT_FORM 变量，
#   不落产物时退化为全维度（与 spec §4 一致）。
# 红线：本表只定义「枚举什么 + 对照哪张表」，不替模型判断维度是否适用——适用判断由 §C+.0 形态判定驱动。
# 排除链：find 类用 -not -path、grep 类用 --exclude-dir，两条命令族都必须排除
# node_modules/dist/.git——npm install 后枚举扫进第三方包 = 计数爆炸假 FAIL。

DIM_FRONTEND_UI_TITLE='前端 UI 组件'
DIM_FRONTEND_UI_FORMS='frontend'
# *.test.tsx/*.spec.tsx 是测试文件
# （DIM_TESTFILES 已单列），被当 UI 组件计入 = 双计数品类错误——React colocated 测试形态下
# 实测枚举 10 = 7 源 .tsx + 3 测试。修：排除 *.test.* / *.spec.* / __tests__ 目录（与
# DIM_TESTFILES 检测面互斥，两处注释互指——改一处须同步另一处）。
DIM_FRONTEND_UI_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*.vue' -o -name '*.svelte' -o -name '*.tsx' -o -name '*.jsx' \\) -not -name '*.test.*' -not -name '*.spec.*' -not -path '*/__tests__/*' -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.venv/*' -not -path '*/venv/*' -not -path '*/site-packages/*' -not -path '*/__pycache__/*' -not -path '*/.tox/*'"
DIM_FRONTEND_UI_RM_REF='§4'

DIM_BACKEND_CONTROLLER_TITLE='后端 controller'
DIM_BACKEND_CONTROLLER_FORMS='backend'
# 旧注解交替 `@(Get|Post|...|RequestMapping|Controller)`
# 无词边界——@Get 前缀误中 Lombok @Getter（@PostConstruct 同理），且类级 @RequestMapping/@Controller
# 非端点也被计数 → Java 枚举虚高 50%（实测 12 命中 vs 8 真实端点）→ 假 FAIL。
# 修：只数 Spring 专用映射注解（精确名 + \b）。类级 @RequestMapping 承载的项目会低估——
# 低估方向安全（清单≥枚举 capped 1.0 PASS + ENUM_ZERO_DIM 披露兜底），优于高估假 FAIL。
# gin 大写动词 `.GET(`/中间件 `.Use(` 形态
# 缺位（原正则只认 JS 小写 router.get 与 Java 注解，实测 6 路由枚举 0）——补 `\\.(GET|POST|...|Use)\\(`。
# gin 大写动词 `.GET(`/中间件 `.Use(` 形态
# 缺位（原正则只认 JS 小写 router.get 与 Java 注解，实测 6 路由枚举 0）——补 `\\.(GET|POST|...|Use)\\(`。
# 枚举须排除测试文件（*_test.go/*.test.ts/*Test.java/test_*.py 等）——
# httptest 里的测试路由注册被计入端点（实测 7 生产路由 + 1 测试注册 = 8 vs 清单 7 → 0.875 假 FAIL）；
# 端点/controller 是生产面维度，测试桩不进生产面。只按文件名排除、不做目录级排除（tests/ 目录
# 里也可能有被清单收录的辅助面，且目录排除会波及 fixture 断言面）。
# axum 形态缺位——`\.route\(` 注册
# 全漏（实测 7 端点枚举 0）。多动词链（.get(h).patch(h).delete(h)）按注册点计 1（低估方向安全：
# 清单≥枚举 capped PASS）；`.get(` 单独不收（HashMap/Vec 访问器误报面大）。
DIM_BACKEND_CONTROLLER_CMD="grep -rhoE 'router\\.(get|post|put|delete|patch|use|all)([^a-zA-Z0-9_]|$)|@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping)\\b|\\.(GET|POST|PUT|DELETE|PATCH|Use)\\(|\\.route\\(|path\\(|re_path\\(|as_view\\(|Route::(get|post|put|delete|patch|resource)\\b|(get|post|put|delete|patch) +./|->(get|post|put|delete)\\(|: (ControllerBase|Controller)\\b|@Controller\\(' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.java' --include='*.go' --include='*.py' --include='*.rs' --include='*.cs' --include='*.php' --include='*.rb' --exclude='*_test.go' --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.test.js' --exclude='*.spec.ts' --exclude='*.spec.js' --exclude='*Test.java' --exclude='*_test.py' --exclude='test_*.py' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
# C# 形态缺位——controller 维对
# .cs 恒 0（ENUM_ZERO_DIM 家族）。补 `: ControllerBase`/`: Controller` 继承声明（=控制器类
# 数，低估方向安全；测试桩不在生产控制器继承链上）。
DIM_BACKEND_CONTROLLER_RM_REF='§6'

DIM_STORE_TITLE='store / 状态管理'
DIM_STORE_FORMS='common'
DIM_STORE_CMD="grep -rlE 'defineStore|createStore|createSlice|new Vuex.Store|@ngrx/store' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.tsx' --include='*.jsx' --exclude='*test*' --exclude='*spec*' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"  # 收紧（D8 收紧）：只认状态定义 token——裸库名（pinia/zustand/jotai/recoil）会匹配 import/装配/测试文件（task-forge 实证：4 store 枚举成 6），诚实清单达不到 0.95 逼清单掺非 store 行；useReducer/Provider.*value 是组件用法非 store 定义。测试文件排除入枚举基线（store 测试不是 store 模块）
DIM_STORE_RM_REF='§9'

DIM_TYPEDEF_TITLE='类型定义'
DIM_TYPEDEF_FORMS='common'
# Rust 形态（pub struct/enum/trait 行首声明——grep -rl 文件级计数，非 pub 的私有
# 类型不进清单面，低估方向安全）。文件级计数对多类型文件按 1 计——同低估原则。
DIM_TYPEDEF_CMD="grep -rlE '^export (interface|type) |^pub (struct|enum|trait) |^(public|internal)[[:space:]]+(sealed[[:space:]]+|static[[:space:]]+|abstract[[:space:]]+|partial[[:space:]]+)*(class|interface|record|struct|enum)[[:space:]]+[A-Za-z_]' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.tsx' --include='*.d.ts' --include='*.rs' --include='*.cs' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
# C# 形态补——行首 public/internal 类型声明（修饰符序列容忍 sealed/static/abstract/
# partial 任意组合；record 位置参数与 class 同型）。测试类同计文件级 1，同 Rust pub struct 口径。
DIM_TYPEDEF_RM_REF='§9'

DIM_ASYNC_CONSUMER_TITLE='异步消费者 / handler'
DIM_ASYNC_CONSUMER_FORMS='async'
DIM_ASYNC_CONSUMER_CMD="grep -rlE '@KafkaListener|@RabbitListener|@StreamListener|@EventHandler|consume\\(|@Subscriber|def handle_|async def handle|@(EventPattern|MessagePattern)\\(' \"\${PROJECT_DIR}\" --include='*.java' --include='*.ts' --include='*.js' --include='*.py' --include='*.go' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
# NestJS 微服务 @EventPattern(/@MessagePattern( 同族形态补（新生态建等价清单范式）。
DIM_ASYNC_CONSUMER_RM_REF='§6'

DIM_API_ENDPOINT_TITLE='接口端点'
DIM_API_ENDPOINT_FORMS='backend'
# 旧 Java 分支 `@(Get|Post|...)\\(` 要求注解名后紧跟括号，
# 但 Spring 实际注解形态是 @GetMapping(...)（Get 后面是 Mapping 不是括号）——该分支在任何
# Spring 项目上恒 0 命中（死正则），Java REST 项目端点维度整体失效（ENUM_ZERO_DIM 兜底披露）。
# 修：精确注解名 + \\b（裸 @GetMapping 无参形态也命中——路径继承类级 @RequestMapping 仍是端点）。
# gin/echo 大写动词形态缺位——原正则只认
# JS 小写 router.get/app.get 与 Java 注解，gin `v1.GET("/orders", h)` 全漏（实测 6 端点枚举 0），
# 而 references/frameworks/gin.md §2 自带正确正则 `\\.(GET|POST|...)\\(`——两处仓内矛盾。
# 修：补大写动词形态（chi/fiber 首字母大写 .Get( 刻意不收——与 cfg.Get( 访问器有误报面，
# 低估方向安全=capped PASS+披露）。测试文件排除口径同上方 controller 维注（生产面维度）。
# Django 分支（R99 note-forge 实测补）：path('api/notes/', views.x)/re_path/DRF @api_view/
# router.register 此前全漏（urls.py 声明式端点不在任何分支——Java 死正则/gin 缺位同族第三例）。
# 引号路径实参要求排除 import 行误中。
DIM_API_ENDPOINT_CMD="grep -rhoE '@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping)\\b|@(Get|Post|Put|Delete|Patch|All|Head|Options)\\b|[[:alnum:]_]*[Rr]outer\\.(get|post|put|delete|patch)\\([^)]*\\)|app\\.(get|post|put|delete|patch)\\(|[[:alnum:]_]*\\.(GET|POST|PUT|DELETE|PATCH)\\([^)]*\\)|\\.route\\(|\\[Http(Get|Post|Put|Delete|Patch)\\b|\b(path|re_path)\(|\b@api_view\(|\brouter\.register\(' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.java' --include='*.go' --include='*.py' --include='*.rs' --include='*.cs' --exclude='*_test.go' --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.test.js' --exclude='*.spec.ts' --exclude='*.spec.js' --exclude='*Test.java' --exclude='*_test.py' --exclude='test_*.py' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"

# NestJS 装饰器裸动词族 @Get(/@Post(/@Put(
# /@Delete(/@Patch(（+ @All/@Head/@Options 冷门动词）缺位——正则只认 Spring @GetMapping 族
# （Mapping 后缀），NestJS 项目端点恒 0 枚举（实测 8 端点枚举 0，勾稽失效）；单词边界防
# @GetMapping 二次命中（alternation Spring 在前，@GetMapping 只走第一支）。
# ASP.NET 端点形态补——`[HttpGet...]` 特性即端点（每方法一特性，一一对应不过冲）；
# [Route] 类级模板非端点本体不收。低估方向安全（清单≥枚举 capped PASS）。
# axum `.route(` 形态见上方 BACKEND_CONTROLLER 注（低估方向安全，多动词链按注册点计）。
DIM_API_ENDPOINT_RM_REF='§6'

DIM_LIB_EXPORT_TITLE='库导出'
DIM_LIB_EXPORT_FORMS='lib'
# 旧式 grep -rhE 数 export **行**（一文件多导出
# 时枚举=N 行）而清单行是**文件**粒度——TS/JS 单文件 6 导出时枚举 17 vs 清单 10，比率 0.59 假 FAIL
# （多导出文件是常态，此维此前只在无 ^export 语言上跑过恒 0，从未在真实项目跑过）。修：grep -rl 文件级
# 计数（对齐头注「grep -rl 每行一文件」契约与 DIM_TYPEDEF 文件级原则——低估方向安全）；
# 补 --include tsx/jsx（React 组件库 .tsx 导出漏计=enum 恒 0）+ --exclude test/spec（与测试文件排除同族，测试导出不计库面）；
# RM_REF 扩 §4 §6 §9 多锚（导出单元横跨组件/接口/数据节，多锚机制见头注）。
DIM_LIB_EXPORT_CMD="grep -rlE '^export ' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.py' --include='*.go' --exclude='*.test.*' --exclude='*.spec.*' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_LIB_EXPORT_RM_REF='§4 §6 §9'

# 测试资产维度：测试文件也是一等清单对象（枚举计数 ↔ reference-manual 测试案例节勾稽）。
# 锚 §测试案例 = template-spec check §1 章节名（AI 填充按该名建节）；零测试项目自然 NO_LIST 不误报。
# 检测模式与 assets/gates-warn.sh check_test 的探测镜像（两处注释互指，改一处须同步另一处）。
DIM_TESTFILES_TITLE='测试文件'
DIM_TESTFILES_FORMS='common'
DIM_TESTFILES_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*test*.py' -o -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*Test.java' -o -name '*_test.go' -o -path '*/tests/*.rs' -o -name 'test_*.rs' -o -name '*Tests.cs' -o -name '*Test.cs' -o -name '*Test.php' -o -name '*_spec.rb' -o -name 'test_*.rb' -o -name '*_test.rb' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' -not -path '*/target/*' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.venv/*' -not -path '*/venv/*' -not -path '*/site-packages/*' -not -path '*/__pycache__/*' -not -path '*/.tox/*'"
# Rust 形态补——集成测试约定 tests/*.rs（tests/common/mod.rs 助手文件一并计入，
# reference-manual §4 收录助手文件时口径一致）；*_test.rs 为同名单元测试变体惯例。
# -not -path '*/target/*' 排除构建产物（cargo 编译中间体不进清单面）。
# .NET 形态补——xUnit 命名约定 *Tests.cs（主流）/ *Test.cs 变体；
# -not -path '*/bin/*' '*/obj/*' 排除构建产物（obj/ 里复制生成的 *.cs 不进清单面）。
DIM_TESTFILES_RM_REF='§测试案例'

# 数据映射三维度（漏改字段防线：字符串耦合点须进清单与计数核验，与 relations-extract
# 的 mapper-binding/data-mapping 边互为表里——清单给人读，边集给脚本查）。
# 检测模式与 relations-extract.sh 的 mapper XML 提取、exploration-guide §C+.1-FW
# mybatis/spring-batch/quartz 枚举段呼应（改一处须同步另一处）。
# 零数据层/零任务项目自然 NO_LIST 不误报；Java 项目须含 -not -path '*/target/*'
# （构建产物复制 XML = 计数膨胀假 FAIL，排除链同源教训）。
DIM_DATA_MODEL_TITLE='数据模型 / ORM 实体'
DIM_DATA_MODEL_FORMS='common'
# 原模式覆盖 JPA/MyBatis-Plus/Mongo/
# Prisma/mongoose/sequelize，缺 SQLAlchemy 声明式（Python 生态最主流 ORM，__tablename__ 是
# DeclarativeBase 声明式的强特征）——fastapi+sqlalchemy 项目此维度必漏报 0。补 __tablename__=。
# 纯 MyBatis 实体（无 JPA/MP 注解）
# 恒 0 命中——补包约定形态（domain/entity/entities/model/po/pojo 包声明；dto/mapper/service 包
# 天然排除）。XML resultMap type= 反查因文件计数粒度错配（N 实体可能 1 个 XML）不采纳，以披露兜底。
# 上方 Java 维补的包约定形态是 Java 点分语法
# `package x.model;`，对 Go 单标识符包 `package model`（无点无分号）恒 0——--include='*.go' 是死配置；
# gorm 模型的强特征 struct tag `gorm:"` 也缺。补：单标识符包声明 + gorm tag 两形态（实测 0→4 文件）。
DIM_DATA_MODEL_CMD="grep -rlE '@Entity\\b|@Table\\b|@TableName\\b|@Document\\b|BaseMapper<|Schema\\(|mongoose\\.|sequelize\\.define|__tablename__[[:space:]]*=|^model[[:space:]]+[A-Za-z].*\\{|package[[:space:]]+[A-Za-z0-9.]+\\.(domain|entity|entities|model|po|pojo);|^package[[:space:]]+(model|models|domain|entity|entities|po|pojo)[[:space:]]*$|gorm:\"|DbSet<' \"\${PROJECT_DIR}\" --include='*.java' --include='*.py' --include='*.ts' --include='*.go' --include='*.prisma' --include='*.cs' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git --exclude-dir=target --exclude-dir=bin --exclude-dir=obj 2>/dev/null"
# .NET 形态补——`DbSet<` 命中 DbContext 文件（文件级 1，低估方向安全）。EF 实体
# 是纯 POCO 无机械标记，同 Rust 数据模型维先例：以 ENUM_ZERO_DIM 披露兜底，不硬造高误报正则。
DIM_DATA_MODEL_RM_REF='§9'

DIM_MAPPER_XML_TITLE='MyBatis mapper XML（SQL 声明层）'
DIM_MAPPER_XML_FORMS='common'
DIM_MAPPER_XML_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*Mapper.xml' -o -name '*mapper.xml' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' -not -path '*/target/*' -not -path '*/.venv/*' -not -path '*/venv/*' -not -path '*/site-packages/*' -not -path '*/__pycache__/*' -not -path '*/.tox/*'"
DIM_MAPPER_XML_RM_REF='§9'

DIM_SCHEDULE_JOB_TITLE='定时 / 批处理任务（job 入口）'
DIM_SCHEDULE_JOB_FORMS='common'
DIM_SCHEDULE_JOB_CMD="grep -rlE '@Scheduled\\b|@EnableScheduling\\b|@EnableBatchProcessing\\b|@DisallowConcurrentExecution\\b|JobDetail\\b|CronTrigger\\b|JobBuilder\\b|StepBuilder\\b|ItemReader\\b|ItemWriter\\b|ItemProcessor\\b|tasklet\\(|beat_schedule|@XxlJob\\b|ElasticJob|IHostedService\\b|BackgroundService\\b' \"\${PROJECT_DIR}\" --include='*.java' --include='*.py' --include='*.cs' --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=__pycache__ --exclude-dir=.tox --exclude-dir=dist --exclude-dir=.git --exclude-dir=target --exclude-dir=bin --exclude-dir=obj 2>/dev/null"
# .NET 形态补——IHostedService/BackgroundService 是托管后台任务入口（Quartz.NET 的
# IJob 形态过宽不收：业务侧 Quartz 实现类多叫 XxxJob 与普通类无词法差异，低估方向安全）。
DIM_SCHEDULE_JOB_RM_REF='§5'

# ORM schema/迁移资产（模型↔迁移漂移是漏改字段的姊妹缺陷——改实体/模型
# 不生成迁移，表结构与代码漂移，运行期才炸。schema/迁移文件必须进 §8 数据字典清单）。
# 覆盖：prisma schema / Django app migrations / alembic / flyway / liquibase changelog /
# TypeORM-sequelize migrations / JPA orm.xml / hibernate hbm.xml / schema*.sql。
DIM_ORM_SCHEMA_TITLE='ORM schema / 迁移资产'
DIM_ORM_SCHEMA_FORMS='common'
# 注：models.py=Django ORM；Vuex 形态已入 DIM_STORE_CMD 正则
DIM_ORM_SCHEMA_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*.prisma' -o -name 'models.py'  -o -name 'orm.xml' -o -name '*.hbm.xml' -o -name 'schema*.sql' -o -name 'V[0-9]*__*.sql' -o -path '*/migrations/*' -o -path '*/Migrations/*.cs' -o -path '*/alembic/versions/*' -o -path '*/db/migration/*' -o -path '*/db/changelog*' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' -not -path '*/target/*' -not -path '*/.venv/*' -not -path '*/venv/*' -not -path '*/site-packages/*' -not -path '*/__pycache__/*' -not -path '*/.tox/*' -not -path '*/bin/*' -not -path '*/obj/*'"
# EF Core Migrations 形态补——*/Migrations/*.cs（迁移体+Designer+模型快照，
# 模型↔迁移漂移防线的清单面；bin/obj 排除同源）。
# lite 档 reference-manual 精简为 §4/§6/§9 三节（无 §8 数据字典），
# 单锚 §8 在 lite 档恒 NO_LIST——模型↔迁移漂移防线在 lite 档失效。RM_REF 支持空格分隔多锚：
# standard/compliance 档登记 §8（数据字典）、lite 档自然登记 §9（数据勾稽），两档皆可核验。
DIM_ORM_SCHEMA_RM_REF='§8 §9'
