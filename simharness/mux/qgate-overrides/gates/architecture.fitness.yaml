apiVersion: qgate/v1alpha1
kind: Gate
metadata:
  id: architecture.fitness
  version: 0.2.0
  description: >
    概设稿四要素机器核验（接口契约/数据流/风险/决策记录在文内命中）。run20 复盘 C4 覆盖件：替换模板占位命令为 scripts/qgate-checks/qgate-check.mjs
    真实执行器（simharness mux/qgate-overrides/ 供给，驱动 G5 前注入本仓）。
    证据解析序：工作树 → origin/integration/RFD-001（集成分支按纪律 71 保留至报告持久化后）。
spec:
  domain: L4
  claims:
    - architecture.rules-machine-checked
  triggers:
    - release
  executors:
    - id: qgate-check
      type: command
      command: ["node", "scripts/qgate-checks/qgate-check.mjs", "arch-fitness"]
      evidenceType: arch-fitness-result
      timeoutMs: 60000
  evidence:
    required:
      - arch-fitness-result
  policy:
    failure: block
    inconclusive: warn
    allowWaiver: true
    maxAgeHours: 24
