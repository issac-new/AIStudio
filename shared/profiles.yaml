shared_config:
  agent:
    environment_probe: false
    max_turns: 90
    parallel_tool_call_guidance: true
    reasoning_effort: ultra
    task_completion_guidance: true
    tool_use_enforcement: auto
  approvals:
    mode: smart
  auxiliary:
    approval:
      model: glm-5.3-flash
      provider: custom:cc-switch
    compression:
      model: glm-5.3-flash
      provider: custom:cc-switch
    session_search:
      model: glm-5.3-flash
      provider: custom:cc-switch
    title_generation:
      model: glm-5.3-flash
      provider: custom:cc-switch
    vision:
      model: glm-5.3-flash
      provider: custom:cc-switch
    web_extract:
      model: glm-5.3-flash
      provider: custom:cc-switch
  compression:
    enabled: true
    target_ratio: 0.15
    threshold: 0.35
  custom_providers:
  - api_key: PROXY_MANAGED
    api_mode: anthropic_messages
    base_url: http://127.0.0.1:15721
    context_length: 1048576
    models:
      glm-5.3-flash:
        name: glm-5.3-flash
    name: cc-switch
  display:
    language: zh
    personality: kawaii
    skin: daylight
  fallback_providers:
  - model: glm-5.3-flash
    provider: custom:cc-switch
  kanban:
    auto_decompose: false
    dispatch_in_gateway: true
    dispatch_interval_seconds: 60
    failure_limit: 2
    max_in_progress_per_profile: 4
    orchestrator_profile: orchestrator
  memory:
    memory_enabled: true
    provider: hindsight
    user_profile_enabled: true
  model:
    default: glm-5.3-flash
    provider: custom:cc-switch
  privacy:
    redact_pii: true
  security:
    redact_secrets: true
    tirith_enabled: true
  terminal:
    backend: local
    cwd: ~/hermes-docker-sandbox/workspace
    persistent_shell: true
    timeout: 180
