profiles:
  # ── 单一事实源 (2026-08-18) ──
  # skills_enabled=允许类目; skills_pinned=允许的顶层单例技能。
  # 执行器: shared/skill-fence.py(update 后由 .git/hooks/post-merge 自动调用)。
  # 主模型统一 shared_config.model(cc-switch), profile 内禁止 model 覆盖, 防漂移。
  orchestrator:
    api_server:
      enabled: true
      port: 8650
      host: 127.0.0.1
    matrix:
      enabled: true
    email:
      enabled: true
    toolsets:
      - hermes-cli
      - kanban
      - memory
      - messaging
    kanban:
      default_assignee: ''
    environment_hint: "~/.hermes/profiles/orchestrator/orchestrator_rules.md\n~/.hermes/profiles/orchestrator/email_kanban_rules.md\n"
    env_extra:
      MATRIX_ACCESS_TOKEN: ${MATRIX_TOKEN}
      MATRIX_HOMESERVER: http://localhost:8008
      MATRIX_USER_ID: '@swarm:matrix.test'
      MATRIX_HOME_ROOM: '!<matrix-room-id>:matrix.test'
      MATRIX_HOME_ROOM_THREAD_ID: $XRDW_UwsDgQjOODLWyPuPSWD4-HT62dz9_IDyJqg_kw
    plugins:
      - acp-client
      - hindsight
      - observability/langfuse
      - matrix-chat-info
      - run-trace
    skills_enabled:
      - autonomous-ai-agents
      - devops
      - software-development
      - github
      - productivity
      - research
      - mcp
    skills_pinned:
      - skill-recall

