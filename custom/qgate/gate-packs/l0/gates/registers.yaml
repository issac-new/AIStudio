apiVersion: qgate/v1alpha1
kind: Gate
metadata:
  id: L0.registers
  version: 0.2.0
  description: >
    L0.3/L0.4 假设与决策登记（v0.1 §6.1，v0.3 §4.4 升级为 exercised 级）：
    JSON 登记（.qgate/registers/{assumptions,decisions}.json）优先——假设须全部 confirmed
    且结构化引用真实、决策须 resolved 或 deferred+revisitBy 未逾期；
    JSON 缺席时回退 md 在档+标记检查（present 级语义：在档 ≠ 被验证）。
spec:
  domain: L0
  claims:
    - L0.registers-maintained
  triggers:
    - task_close
    - pre_commit
  executors:
    - id: l0.registers
      type: register
      register: ["assumptions", "decisions"]
      evidenceType: registers-present
  evidence:
    required:
      - registers-present
  policy:
    failure: warn
    inconclusive: warn
    allowWaiver: true
    maxAgeHours: 24
