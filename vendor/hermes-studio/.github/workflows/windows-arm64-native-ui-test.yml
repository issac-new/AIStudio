name: Test Windows ARM64 Native UI
on:
  pull_request:
    paths:
      - '.github/workflows/windows-arm64-native-ui-test.yml'
      - 'tests/fixtures/native-device-pointer.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix packages/desktop --no-audit --no-fund
      - run: npm --prefix packages/desktop run build
      - run: node packages/desktop/scripts/verify-native-device-switcher.cjs --output-dir=packages/desktop/native-device-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-native-ui-report
          path: packages/desktop/native-device-checks
