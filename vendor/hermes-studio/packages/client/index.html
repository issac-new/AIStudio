<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230d1428%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-size%3D%2240%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%2338bdf8%22%3ES%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/logo-loading.css" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f7f7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SwarmStudio" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SwarmStudio</title>
  <style>
    html,
    body,
    #app {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg-primary, #f7f7f4);
    }

    html.dark body {
      background: var(--bg-primary, #1a1a1a);
    }

    .boot-fallback {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text-primary, #222222);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    html.dark .boot-fallback {
      color: var(--text-primary, #f0f0f0);
    }

    html.hermes-desktop-windows,
    html.hermes-desktop-windows body,
    html.hermes-desktop-windows #app {
      background: transparent;
    }

    html.hermes-desktop-windows .boot-fallback {
      background: var(--bg-primary, #f7f7f4);
      border-radius: 10px;
      overflow: hidden;
    }

    html.hermes-desktop-windows.dark .boot-fallback {
      background: var(--bg-primary, #1a1a1a);
    }

    .boot-fallback__logo-wrap {
      --studio-loading-size: 72px;
    }

    /* overlay[boot-caption]: 首帧文字反馈（原纯 logo 无提示，2026-10-20 W2 挂账清零） */
    .boot-fallback__brand {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .boot-fallback__caption {
      font-size: 13px;
      color: var(--text-muted, #8a8a8a);
      letter-spacing: 0.02em;
    }
  </style>

  <!-- Prevent FOUC by applying theme classes immediately -->
  <script>
    (function() {
      try {
        const brightness = localStorage.getItem('hermes_brightness') || 'dark';
        const style = localStorage.getItem('hermes_style') === 'comic' ? 'comic' : 'ink';

        // Resolve dark mode
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = brightness === 'dark' || (brightness === 'system' && prefersDark);

        // Resolve comic style
        const isComic = style === 'comic';

        // Apply classes immediately
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        if (isComic) {
          document.documentElement.classList.add('comic');
        }

        // Use this account's cached colors while the application bundle loads.
        // The authenticated theme response remains the source of truth.
        try {
          const payload = (localStorage.getItem('hermes_api_key') || '').split('.')[1];
          if (payload) {
            const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
            const userId = Number(JSON.parse(atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, '='))).sub);
            if (Number.isInteger(userId) && userId > 0) {
              const theme = JSON.parse(localStorage.getItem('hermes_theme_customization_v1:' + userId) || '{}');
              for (const [name, color] of [['--bg-primary', theme.appearance?.global?.backgroundColor], ['--text-primary', theme.textColor]]) {
                if (typeof color === 'string' && /^#[0-9a-f]{6}$/i.test(color)) document.documentElement.style.setProperty(name, color);
              }
            }
          }
        } catch (_) { /* Invalid or expired local state uses the preset. */ }

        const desktop = window.hermesDesktop;
        if (desktop?.isDesktop) {
          document.documentElement.classList.add('hermes-desktop-shell');
        }
        if (desktop?.isDesktop && desktop?.platform === 'win32') {
          document.documentElement.classList.add('hermes-desktop-windows');
        }
        if (desktop?.windowKind === 'pet' || window.location.hash.startsWith('#/desktop-pet')) {
          document.documentElement.classList.add('hermes-desktop-pet-window');
        }
      } catch (e) {
        console.warn('Failed to apply theme:', e);
      }
    })();
  </script>
</head>

<body>
  <div id="app">
    <div class="boot-fallback">
      <div class="boot-fallback__brand">
        <span class="boot-fallback__logo-wrap studio-loading-logo">
          <img src="/logo.png" alt="" />
        </span>
        <span class="boot-fallback__caption">SwarmStudio 加载中…</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
