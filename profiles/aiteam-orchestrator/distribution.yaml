name: aiteam-orchestrator
version: 3.0.0
description: "aiteam-orchestrator — AI research domain gateway/worker"
hermes_requires: ">=0.12.0"
author: "SwarmTeam"
license: "MIT"
team: aiteam
env_requires:
  - name: MATRIX_ACCESS_TOKEN
    description: "Matrix access token (gateway, optional)"
    required: false
    default: ""
  - name: WEIXIN_TOKEN
    description: "WeChat bot token (optional)"
    required: false
    default: ""
  - name: WEIXIN_ACCOUNT_ID
    description: "WeChat bot account id (optional)"
    required: false
    default: ""
