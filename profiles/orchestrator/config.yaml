model:
  default: glm-5.3-flash
  provider: custom:cc-switch
fallback_providers:
  - model: glm-5.3-flash
    provider: custom:cc-switch
toolsets:
  - hermes-cli
  - kanban
  - memory
  - messaging
agent:
  max_turns: 90
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: false
  environment_hint: ~/.hermes/profiles/orchestrator/SOUL.md
  reasoning_effort: ultra
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.15
auxiliary:
  vision:
    provider: custom:cc-switch
    model: glm-5.3-flash
  compression:
    provider: custom:cc-switch
    model: glm-5.3-flash
  approval:
    provider: custom:cc-switch
    model: glm-5.3-flash
  title_generation:
    provider: custom:cc-switch
    model: glm-5.3-flash
  session_search:
    model: glm-5.3-flash
    provider: custom:cc-switch
  web_extract:
    model: glm-5.3-flash
    provider: custom:cc-switch
display:
  personality: kawaii
  skin: daylight
  language: zh
  message_reactions: true
privacy:
  redact_pii: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
approvals:
  mode: smart
command_allowlist:
  - script execution via -e/-c flag
  - git branch force delete
  - execute_code
plugins:
  disabled: []
  enabled:
    - acp-client
    - hindsight
    - observability/langfuse
    - matrix-chat-info
    - run-trace
security:
  redact_secrets: true
  tirith_enabled: true
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  orchestrator_profile: orchestrator
  default_assignee: ''
  max_in_progress_per_profile: 4
  auto_decompose: false
gateway:
  multiplex_profile_allowlist:
    - [已移除]-orchestrator
  multiplex_profiles: true
onboarding:
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
  profile_build: ask
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 41
custom_providers:
  - api_key: PROXY_MANAGED
    api_mode: anthropic_messages
    base_url: http://127.0.0.1:15721
    context_length: 1048576
    models:
      glm-5.3-flash:
        name: glm-5.3-flash
    name: cc-switch
platforms:
  api_server:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8650
  matrix:
    enabled: true
  email:
    enabled: false
extra:
  skills_enabled_by_category:
    - autonomous-ai-agents
    - devops
    - software-development
    - github
    - productivity
    - research
    - mcp
    - devops-rd
  skills_pinned:
    - skill-recall
    - cognition-lattice
mcp_servers:
  hermes-studio-api:
    command: 
      /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - api
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: orchestrator
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-browser:
    command: 
      /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - browser
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: orchestrator
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-devices:
    command: 
      /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - devices
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: orchestrator
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  hermes-studio-use:
    command: 
      /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - use
    timeout: 1860
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: orchestrator
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
platform_toolsets:
  cli:
    - acp
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - messaging
    - moa
    - session_search
    - skills
    - spotify
    - terminal
    - todo
    - tts
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
known_plugin_toolsets:
  cli:
    - acp
    - spotify
clearances:
  - TLP:GREEN
  - TLP:CLEAR
WEIXIN_HOME_CHANNEL: HK_DAD_WX@im.wechat

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
