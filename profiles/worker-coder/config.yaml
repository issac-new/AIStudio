model:
  default: aim
  provider: custom:cc-switch
providers: null
custom_providers:
  - name: cc-switch
    base_url: http://127.0.0.1:15721
    api_key: PROXY_MANAGED
    api_mode: anthropic_messages
    context_length: 1048576
    models:
      aim:
        name: aim
        context_length: 1048576
  - name: kimicode
    base_url: https://api.kimi.com/coding
    api_key: ${KIMI_API_KEY}
    api_mode: anthropic_messages
    context_length: 1048576
    models:
      k3:
        name: k3
    model: k3
toolsets:
  - hermes-cli
  - acp
  - kanban
  - memory
agent:
  max_turns: 90
  reasoning_effort: ultra
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: false
  environment_hint: ~/.hermes/profiles/worker-coder/worker-coder_rules.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress_per_profile: 4
  auto_decompose: false
  orchestrator_profile: orchestrator
  default_assignee: worker-coder
display:
  skin: daylight
  language: zh
  personality: kawaii
security:
  redact_secrets: true
  tirith_enabled: true
privacy:
  redact_pii: true
approvals:
  mode: smart
auxiliary:
  title_generation:
    provider: custom:cc-switch
    model: aim
  compression:
    provider: custom:cc-switch
    model: aim
  session_search:
    provider: custom:cc-switch
    model: aim
  web_extract:
    provider: custom:cc-switch
    model: aim
  vision:
    provider: custom:cc-switch
    model: aim
  approval:
    provider: custom:cc-switch
    model: aim
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
plugins:
  disabled: []
  enabled:
    - acp-client
    - hindsight
    - observability/langfuse
    - run-trace
extra:
  skills_enabled_by_category:
    - software-development
    - devops
    - github
    - research
    - data-science
    - mlops
    - autonomous-ai-agents
    - note-taking
    - productivity
    - mcp
  skills_pinned:
    - skill-recall
mcp_servers:
  hermes-studio-api:
    command: $HOME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - api
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: $HOME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: $HOME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: worker-coder
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-browser:
    command: $HOME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - browser
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: $HOME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: $HOME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: worker-coder
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-devices:
    command: $HOME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - devices
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: $HOME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: $HOME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: worker-coder
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-use:
    command: $HOME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - use
    timeout: 1860
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: $HOME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: $HOME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: worker-coder
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
onboarding:
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
  profile_build: ask
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 29
clearances:
  - TLP:GREEN
  - TLP:CLEAR
