model:
  default: glm-5.2
  provider: damoxing
  base_url: ${DAMOXING_BASE_URL}
providers:
  damoxing:
    base_url: ${DAMOXING_BASE_URL}
    api_key: ${DAMOXING_API_KEY}
    api_mode: ${DAMOXING_API_MODE}
    context_length: 1048576
    models:
    - glm-5
    - glm-5.1
    - glm-5.1-20260408
    - glm-5.2
    - glm-5.2-20260613
    - GLM-5.2-C
custom_providers:
- name: kimicode
  base_url: https://api.kimi.com/coding
  api_key: ${KIMI_API_KEY}
  api_mode: anthropic_messages
  context_length: 1048576
  models:
    k3:
      name: k3
  model: k3
toolsets:
- hermes-cli
- kanban
- memory
agent:
  max_turns: 90
  reasoning_effort: xhigh
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: false
  environment_hint: ~/.hermes/profiles/project-manager/project-manager_rules.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  timeout: 180
  persistent_shell: true
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: hindsight
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress_per_profile: 4
  auto_decompose: false
  orchestrator_profile: orchestrator
  default_assignee: ''
display:
  skin: daylight
  language: zh
  personality: kawaii
security:
  redact_secrets: true
  tirith_enabled: true
privacy:
  redact_pii: true
approvals:
  mode: smart
auxiliary:
  title_generation:
    provider: damoxing
    model: glm-5.2
  compression:
    provider: damoxing
    model: glm-5.2
  session_search:
    provider: damoxing
    model: glm-5.2
  web_extract:
    provider: damoxing
    model: glm-5.2
  vision:
    provider: custom:kimicode
    model: k3
  approval:
    provider: deepseek
    model: deepseek-v4-flash
fallback_providers:
- provider: damoxing
  model: glm-5.1
- provider: deepseek
  model: deepseek-v4-flash
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
plugins:
  disabled: []
  enabled:
  - acp-client
  - hindsight
  - observability/langfuse
  - run-trace
extra:
