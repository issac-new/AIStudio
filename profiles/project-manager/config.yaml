mcp_servers:
  hermes-studio-api:
    command: $HOME/.hermes-web-ui/desktop-runtime/hermes/0.19.0/mac-arm64/node/bin/node
    args:
    - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
    - api
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: $HOME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: $HOME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: project-manager
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: '1'
