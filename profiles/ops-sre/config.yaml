model:
  default: aim
  provider: custom:cc-switch
custom_providers:
  - api_key: PROXY_MANAGED
    api_mode: anthropic_messages
    base_url: http://127.0.0.1:15721
    context_length: 1048576
    models:
      glm-5.3-flash:
        name: glm-5.3-flash
    name: cc-switch
toolsets:
  - hermes-cli
  - acp
  - kanban
  - memory
agent:
  environment_probe: false
  max_turns: 90
  parallel_tool_call_guidance: true
  reasoning_effort: ultra
  task_completion_guidance: true
  tool_use_enforcement: auto
  environment_hint: ~/.hermes/profiles/ops-sre/SOUL.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  persistent_shell: true
  timeout: 180
compression:
  enabled: true
  target_ratio: 0.15
  threshold: 0.35
memory:
  memory_enabled: true
  provider: ''
  user_profile_enabled: true
kanban:
  auto_decompose: false
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress_per_profile: 4
  orchestrator_profile: orchestrator
  default_assignee: ops-sre
display:
  language: zh
  skin: daylight
security:
  redact_secrets: true
privacy:
  redact_pii: true
approvals:
  mode: 'off'
auxiliary:
  approval:
    model: glm-5.3-flash
    provider: custom:cc-switch
  background_review:
    provider: custom:cc-switch
    model: glm-5.3-flash
  compression:
    model: claude-opus-5
    provider: custom:cc-switch
  goal_judge:
    provider: custom:cc-switch
    model: glm-5.3-flash
  kanban_decomposer:
    provider: custom:cc-switch
    model: glm-5.3-flash
  moa_aggregator:
    provider: custom:cc-switch
    model: glm-5.3-flash
  moa_reference:
    provider: custom:cc-switch
    model: glm-5.3-flash
  profile_describer:
    provider: custom:cc-switch
    model: glm-5.3-flash
  session_search:
    model: glm-5.3-flash
    provider: custom:cc-switch
  title_generation:
    model: glm-5.3-flash
    provider: custom:cc-switch
  triage_specifier:
    provider: custom:cc-switch
    model: glm-5.3-flash
  vision:
    model: glm-5.3-flash
    provider: custom:cc-switch
  web_extract:
    model: glm-5.3-flash
    provider: custom:cc-switch
fallback_providers:
  - provider: custom:cc-switch
    model: aim
    api_mode: anthropic_messages
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
  weixin:
    enabled: true
plugins:
  disabled:
    - hindsight
  enabled:
    - acp-client
    - hindsight
    - observability/langfuse
    - run-trace
extra:
  skills_enabled_by_category:
    - devops
    - software-development
    - github
    - autonomous-ai-agents
    - productivity
    - mcp
  skills_pinned:
    - skill-recall
mcp_servers:
  ekko-studio-api:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - api
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: ops-sre
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  ekko-studio-browser:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - browser
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: ops-sre
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  ekko-studio-devices:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - devices
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: ops-sre
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  ekko-studio-use:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - use
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: ops-sre
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
    timeout: 1860
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
onboarding:
  profile_build: ask
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
updates:
  backup_keep: 5
  non_interactive_local_changes: stash
  pre_update_backup: false
_config_version: 50
clearances:
  - TLP:GREEN
  - TLP:CLEAR
