name: requirement-analyst
version: 1.0.0
description: "Requirements analyst — PRD, user stories"
hermes_requires: ">=0.12.0"
author: "SwarmTeam"
license: "MIT"
team: swarm
env_requires:
  - name: DEEPSEEK_API_KEY
    description: "DeepSeek API key (primary LLM)"
    required: true
    default: ""
  - name: GLM_API_KEY
    description: "Z.AI/GLM API key (GLM-5.2 model)"
    required: true
    default: ""
  - name: SILICONFLOW_API_KEY
    description: "SiliconFlow API key (Hindsight embeddings)"
    required: false
    default: ""
  - name: MATRIX_ACCESS_TOKEN
    description: "Matrix access token (gateway)"
    required: false
    default: ""
  - name: ANTHROPIC_AUTH_TOKEN
    description: "Anthropic token (ACP Claude Code)"
    required: false
    default: ""
  - name: ANTHROPIC_BASE_URL
    description: "Anthropic base URL (cc switch proxy)"
    required: false
    default: ""
