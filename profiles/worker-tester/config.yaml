model:
  default: glm-5.3-flash
  provider: custom:cc-switch
custom_providers:
  - api_key: PROXY_MANAGED
    api_mode: anthropic_messages
    base_url: http://127.0.0.1:15721
    context_length: 1048576
    models:
      glm-5.3-flash:
        name: glm-5.3-flash
    name: cc-switch
toolsets:
  - hermes-cli
  - acp
  - kanban
  - memory
agent:
  environment_probe: false
  max_turns: 90
  parallel_tool_call_guidance: true
  reasoning_effort: ultra
  task_completion_guidance: true
  tool_use_enforcement: auto
  environment_hint: ~/.hermes/profiles/worker-tester/SOUL.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  persistent_shell: true
  timeout: 180
compression:
  enabled: true
  target_ratio: 0.15
  threshold: 0.35
memory:
  memory_enabled: true
  provider: hindsight
  user_profile_enabled: true
kanban:
  auto_decompose: false
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress_per_profile: 4
  orchestrator_profile: orchestrator
  default_assignee: worker-tester
display:
  language: zh
  personality: kawaii
  skin: daylight
security:
  redact_secrets: true
  tirith_enabled: true
privacy:
  redact_pii: true
approvals:
  mode: smart
auxiliary:
  approval:
    model: glm-5.3-flash
    provider: custom:cc-switch
  compression:
    model: glm-5.3-flash
    provider: custom:cc-switch
  session_search:
    model: glm-5.3-flash
    provider: custom:cc-switch
  title_generation:
    model: glm-5.3-flash
    provider: custom:cc-switch
  vision:
    model: glm-5.3-flash
    provider: custom:cc-switch
  web_extract:
    model: glm-5.3-flash
    provider: custom:cc-switch
fallback_providers:
  - provider: alibaba
    model: qwen3-max
  - provider: kimi-coding
    model: k3
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
plugins:
  disabled: []
  enabled:
    - acp-client
    - hindsight
    - observability/langfuse
    - run-trace
extra:
  skills_enabled_by_category:
    - software-development
    - github
    - mlops
    - devops
    - autonomous-ai-agents
    - mcp
    - productivity
    - devops-rd
  skills_pinned:
    - skill-recall
mcp_servers:
  hermes-studio-api:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - api
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: worker-tester
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  hermes-studio-browser:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - browser
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: worker-tester
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  hermes-studio-devices:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - devices
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: worker-tester
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  hermes-studio-use:
    args:
      - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
      - use
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: worker-tester
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
    timeout: 1860
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - messaging
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify
onboarding:
  profile_build: ask
  seen:
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
updates:
  backup_keep: 5
  non_interactive_local_changes: stash
  pre_update_backup: false
_config_version: 41
clearances:
  - TLP:GREEN
  - TLP:CLEAR

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
