arg_contracts:
  cronjob:
    when_action: create
    required_args:
    - schedule
    - prompt
  computer_use:
    enum_args:
      action:
      - capture
      - click
      - double_click
      - right_click
      - middle_click
      - drag
      - scroll
      - type
      - key
      - set_value
      - wait
      - list_apps
      - list_windows
      - focus_app
      - cua_browser_state
      - cua_browser_prepare
      - cua_browser_navigate
      - cua_browser_click
      - cua_browser_type
      - cua_browser_pointer
      - cua_browser_dialog
      - cua_browser_set_input_files
      - cua_browser_download
  execute_code:
    required_args:
    - code
  delegate_task:
    required_args:
    - goal
  acp_send:
    required_args:
    - prompt
  memory:
    required_args:
    - target
terminal_blacklist:
- \brm\s+(-[a-zA-Z]*f[a-zA-Z]*\s+)?(-[a-zA-Z]*r[a-zA-Z]*\s+)*/(\s|$|;|&)
- \brm\s+-[a-zA-Z]*\s*/\s*\*
- \bmkfs(\.[a-z0-9]+)?\s
- \bdd\s+.*\bif=\S+\s+.*\bof=/dev/
- ':\(\)\s*\{\s*:\|:\s*&\s*\}\s*;?:'
- \bgit\s+push\s+.*--force.*\b(main|master|release|protected)\b
- \bgit\s+push\s+(-f|--force)\b
- \b(shutdown|reboot|halt|poweroff)\b
