# §二 v1.4「Action 名与现行工具面映射」: 语义层契约名 → 现行工具名
# 判定 reversible/level 时按语义等价映射, 不因工具改名绕过 Staged Action 协议
tool_mapping:
  browser_navigate:
    - browser_exec
    - computer_use
    - cua_browser_navigate
  browser_click:
    - browser_exec
    - computer_use
    - cua_browser_click
  browser_type:
