# 参数级契约: 对 reversible=false 且 level ∈ gated_levels 的动作, 必要参数存在性 + 枚举值校验
arg_contracts:
  cronjob:
    when_action: create
    required_args: [schedule, prompt]
  computer_use:
    enum_args:
      action:
        - capture
        - click
        - double_click
        - right_click
        - middle_click
        - drag
        - scroll
        - type
        - key
        - set_value
        - wait
        - list_apps
        - list_windows
        - focus_app
        - cua_browser_state
        - cua_browser_prepare
        - cua_browser_navigate
        - cua_browser_click
        - cua_browser_type
        - cua_browser_pointer
        - cua_browser_dialog
        - cua_browser_set_input_files
        - cua_browser_download

# terminal 命令黑名单正则 (借鉴 nous L4 V1/V4 思想): 命中即 block
terminal_blacklist:
  - '\brm\s+(-[a-zA-Z]*f[a-zA-Z]*\s+)?(-[a-zA-Z]*r[a-zA-Z]*\s+)*/(\s|$|;|&)'   # rm -rf /
  - '\brm\s+-[a-zA-Z]*\s*/\s*\*'                                                # rm -rf /*
  - '\bmkfs(\.[a-z0-9]+)?\s'                                                    # mkfs 格式化
  - '\bdd\s+.*\bif=\S+\s+.*\bof=/dev/'                                          # dd 写裸设备
  - ':\(\)\s*\{\s*:\|:\s*&\s*\}\s*;?:'                                          # fork bomb
  - '\bgit\s+push\s+.*--force.*\b(main|master|release|protected)\b'             # force push 受保护分支
  - '\bgit\s+push\s+(-f|--force)\b'                                             # 任何 git push --force
  - '\b(shutdown|reboot|halt|poweroff)\b'                                       # 系统关机/重启
