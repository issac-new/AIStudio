# sensitive fixture (violating)：源码含 sk- 密钥串 → fail
# SENSITIVE_TOOL=builtin：pin 内置正则路径（本 fixture 专测内置路径；gitleaks 路径由
# violating-gitleaks/compliant-gitleaks 两组以 PATH mock 专测）。不 pin 时 auto 档随
# 运行环境是否装 gitleaks 走不同代码路径，输出文案漂移（gitleaks 路径含"硬编码密钥"，
# 内置路径为"疑似敏感信息"）致 expect-output 断言在无 gitleaks 环境（ubuntu CI）失败——
# 与 SBOM_TOOL=none 的环境确定性先例一致（fixture 结果不应随机器工具链漂移）。
PROJECT_DIR="__REPO_ROOT__"
SENSITIVE_TOOL="builtin"
SCAN_DIRS=("src")
