# sensitive fixture (compliant-testdata-excluded)：**误报回归锁**（七轮复盘）
# mock gitleaks 会命中 src/testdata/fake_key.js 与 src/config_test.js 里的 sk- 假密钥，
# 但两者都是**测试固件**——门禁须排除，退出 0。
#
# 背景：七轮实测 gin 项目被误报 2 处（context_test.go / testdata/certificate/key.pem）。
# 根因是同一门禁两条路径判定标准不一致：
#   内置正则路径（gates-warn.sh:157）有 grep -viE 'example|placeholder|test|mock|dummy' 排除；
#   gitleaks 路径直扫 SCAN_DIRS，零排除。
# 六轮把两条路径改叠加执行后，这个不对称更显性——装了 gitleaks 反而多收测试固件误报。
#
# 本 fixture 锁的是：gitleaks 路径也须排除测试固件（与内置路径对齐）。
# 修复前会失败（testdata/test 文件被误报 → 退出 1）。
PROJECT_DIR="__REPO_ROOT__"
export PATH="__REPO_ROOT__/bin:$PATH"
SENSITIVE_TOOL="auto"
SCAN_DIRS=("src")
