# branch fixture (violating-on-master)：HEAD 停在 master 基分支 → 保护名单含 master 时 fail
# （R56-D3 变异锁：master 基分支仓库默认零保护缺口——git init 默认 master 形态）
# git 仓库由 scripts/setup.sh 运行时生成（git init + 基线提交后留在 master），teardown.sh 清理
PROJECT_DIR="__REPO_ROOT__"
PROTECTED_BRANCHES=("main" "master")
BRANCH_REGEX='^(feat|fix|refactor)/.+'
