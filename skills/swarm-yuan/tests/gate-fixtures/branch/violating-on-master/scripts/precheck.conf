# branch fixture (violating-on-master)：master 上有白名单外源码改动 → 保护名单含 master 时 fail
# （R56-D3 变异锁：master 基分支仓库默认零保护缺口——git init 默认 master 形态）
# git 仓库由 scripts/setup.sh 运行时生成（基线提交后留在 master + 未跟踪 src/feature.js），teardown.sh 清理
PROJECT_DIR="__REPO_ROOT__"
PROTECTED_BRANCHES=("main" "master")
PROTECTED_BRANCH_ALLOW="*.md docs/**"
BRANCH_REGEX='^(feat|fix|refactor)/.+'
