# security fixture (violating-auto)：**auto 档回归锁**（六轮复盘）
# 与同级 violating/（SECURITY_TOOL="builtin" 强制内置，跨机器确定性）互补：
# 本 fixture 用 auto 档——即真实用户的默认路径（precheck.arch.conf 默认值）。
#
# 锁的契约：auto 档下 semgrep 通过后**必须继续跑内置模式族**（叠加执行），
# 而非"semgrep 通过就 return"（六轮复盘实测缺陷：装了 semgrep 的用户
# SQL 拼接 + eval 全漏抓，比不装工具更弱）。
#
# 注：本 fixture 在有/无 semgrep 的机器上都应 fail——
#   无 semgrep → auto 降级 builtin → 内置抓到；
#   有 semgrep → semgrep 0 命中但叠加跑内置 → 内置抓到。
PROJECT_DIR="__REPO_ROOT__"
SECURITY_TOOL="auto"
WRITABLE_DIRS=("src")
SCAN_DIRS=()
