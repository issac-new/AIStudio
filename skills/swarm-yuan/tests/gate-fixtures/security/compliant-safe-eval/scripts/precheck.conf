# security fixture (compliant-safe-eval)：**误报回归锁**（七轮复盘）
# 与同级 compliant/（完全无可疑关键字）互补：本 fixture 含 "eval(" 子串但实际安全
# （ast.literal_eval / json.loads / .safe_eval），锁"合法写法必 pass"这一方向。
#
# 现有 fixture 体系全是"违规必 fail"方向（violating*/），缺"合法必 pass"的反向锁——
# 导致误报缺陷无人看守（七轮实测：3 个成熟开源项目 6 处 fail 中 4 处误报，67%）。
# 本 fixture 与六轮的 violating-auto 是对称动作：一个锁漏抓，一个锁误报。
#
# SECURITY_TOOL=builtin：只测内置规则的白名单（semgrep 对 ast.literal_eval 本就不报，
# 走 semgrep 会掩盖内置规则的缺陷）。
PROJECT_DIR="__REPO_ROOT__"
SECURITY_TOOL="builtin"
WRITABLE_DIRS=("src")
SCAN_DIRS=()
