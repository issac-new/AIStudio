# sbom fixture (violating-unavailable)：空项目 + SBOM_REQUIRED=1，无工具无 lockfile → fail-closed
# SBOM_TOOL=none 显式屏蔽外部工具（check_sbom 既有确定性路径）：机器装有 syft/cdxgen 时
# fixture 结果不漂移——否则工具探测命中本机 syft，"unavailable" 场景不成立（环境依赖遗留）
PROJECT_DIR="__REPO_ROOT__"
SBOM_REQUIRED=1
SBOM_TOOL=none
SBOM_OUTPUT_DIR="__REPO_ROOT__/.sbom-out"
