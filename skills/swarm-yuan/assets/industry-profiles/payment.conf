# =============================================================================
# payment.conf — 支付行业 profile 配置覆盖包（industry profile: payment）
#
# 用法：生成支付行业项目 skill 时，将本文件内容追加到 scripts/precheck.conf 末尾
#      （同名标量/数组后定义覆盖先定义；词表类用合并式写法保留基线值）。
# 姿态：与 references/standards-compliance.md §F 一致——未配置静默跳过、启用后 fail-closed；
#      豁免按 §F.2 五字段登记（对象|规则|理由|审批人|日期），空理由视为无效豁免 → fail。
# 条款依据：references/industry-profile-payment.md（支付业务与技术融合文档，
#      业务机理/条款映射/差额项）；金融业通用合规基线叠加 references/industry-profile-finance.md。
# 兼容性：bash 3.2 可 source（无数组关联、无 declare -A；数组合并用 ${VAR[@]+"${VAR[@]}"} 防护）。
# =============================================================================

# ===== 个人金融信息/支付敏感数据保护（--privacy）=====
# 依据：JR/T 0171-2020 第 4/6 章（C3/C2/C1 分级，C3 鉴别信息不得明文存储/传输/展示）；
#      个保法 §51（三）（加密、去标识化）；PCI DSS（卡号加密存储、脱敏展示）。
# 判定：启用后 fail-closed——配置目录全不存在 → fail；PII 命中 → fail。切勿带占位值上生产。
PRIVACY_SCAN_DIRS=("<必填：源码目录>" "<必填：测试/夹具目录>")   # 本 profile 必填项
# 支付场景敏感字段 ERE（grep -E 消费）：CVV2/磁道/交易密码等 C3 鉴别特征串；
# 强制带字段名上下文 + 分隔段，压制纯数字误报
PRIVACY_EXTRA_PATTERNS=(${PRIVACY_EXTRA_PATTERNS[@]+"${PRIVACY_EXTRA_PATTERNS[@]}"} \
  "(CVV2|CVN2|CVC2|安全码)[^0-9A-Za-z]{0,4}[0-9]{3,4}" \
  "(磁道|track[_ ]?data|track2)[^0-9A-Za-z]{0,4}[0-9D=F]{10,}" \
  "(交易密码|支付密码|支付口令)[^0-9A-Za-z]{0,4}[0-9A-Za-z*]{6,}")
# 支付敏感字段名固定串词表（grep -F 消费，命中即 fail；测试构造数据走 PRIVACY_EXEMPTIONS 豁免）
PRIVACY_SENSITIVE_KEYWORDS=(${PRIVACY_SENSITIVE_KEYWORDS[@]+"${PRIVACY_SENSITIVE_KEYWORDS[@]}"} \
  "银行卡号" "身份证号" "支付密码" "交易密码" "CVV2" "短信验证码" "磁道数据" "备付金账号")

# ===== 密码合规（--crypto）=====
# 依据：GB/T 39786-2021 8.4（三级应用和数据安全应采用密码技术）；银联/密评场景国密要求；
#      支付报文签名验签（ISO 8583 系 MAC/PIN 加密）。
# 判定：弱算法 MD5/SHA1/DES/RSA-1024/ECDSA 命中 → fail；国密白名单 SM2/SM3/SM4。
CRYPTO_PROFILE="gm"
CRYPTO_SCAN_DIRS=("<按项目填：服务端源码目录>")

# ===== 敏感个人信息处理前 PIA（compliance 层）=====
# 依据：个保法 §55/§56（处理敏感个人信息——金融账户——事前个人信息保护影响评估，
#      报告至少保存三年）。支付账户属个保法 §28 敏感个人信息，须单独同意。
PIA_REQUIRED=1

# ===== 服务端授权（--authz）=====
# 依据：GB/T 22239-2019 7.1.4.2（访问控制最小权限）；银监发〔2014〕40 号 §21（授权体系）；
#      CWE Top 25:2025 授权类四弱点（支付接口越权=资金风险直接敞口）。
# 判定：缺鉴权注解 / IDOR / CORS 放行带凭据 → fail（启用后 fail-closed）。
AUTHZ_SCAN_DIRS=("<必填：服务端源码目录>")
AUTHZ_EXTRA_PATTERNS=()

# ===== 供应链 SBOM（--sbom）=====
# 依据：OWASP Top 10:2025 A03（供应链失效）；GB/T 43848-2024（开源代码安全评价）。
SBOM_REQUIRED=1
SBOM_LICENSE_BLOCKLIST=("GPL-3.0" "AGPL")

# ===== 发布签名（--release-sign）=====
# 依据：NIST SP 800-218 v1.1 PS.2（发布完整性验证）；SLSA v1.0 Build L2。
# 判定：发布产物缺 .sig/.asc/.att/.bundle → fail；cosign 可用时验签失败 → fail；无 cosign 降级 warn。
RELEASE_SIGN_REQUIRED=1

# ===== 对账/账务勾稽（--consistency）=====
# 依据：§2.3 三方对账、§2.4 复式记账试算平衡；银监发〔2014〕40 号 §22/§23（核对制度）。
# 判定：业务勾稽粗筛（词法层），真实对账平衡属差额项人工核对（立法文档 §5-①）。
CONSISTENCY_DIRS=("<按项目填：账务/对账源码目录>")

# ===== 证据留痕（GATE_RUNS_DIR）=====
# 门禁运行记录 JSONL 落盘（支付审计取证建议开启）；置空=关闭。
GATE_RUNS_DIR=".swarm-yuan/gate-runs"

# ===== 典型技术栈 → 框架映射提示（ACTIVE_FRAMEWORKS_HINT）=====
# 支付系统典型技术栈常激活的框架门禁（供 detect-profile / 特征卡推导参考，非强制启用）。
# 详见 references/industry-profile-payment.md §6 映射表。
ACTIVE_FRAMEWORKS_HINT="spring-boot spring-cloud spring-security mybatis redis kafka rocketmq seata sharding elasticjob"
