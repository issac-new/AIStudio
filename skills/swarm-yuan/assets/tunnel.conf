# tunnel.conf — 堡垒机隧道配置（用户可填充模板；由 swarm-yuan 随技能分发，升级保留用户内容）
# 被 scripts/tunnel.sh 读取。仍是占位模板时（含「（填入」标记）tunnel.sh 一律 fail-closed 拒绝执行。
# 场景与用法详见 references/bugfix-runbook.md（排障流水线）与 references/remote-debug-jvm.md（JDWP）。
# shell 语法：等号赋值，值含空格须整体引号。

# 堡垒机（跳板机）：user@host，可跟端口参数，如 "devops@bastion.corp -p 2222"
JUMP_HOST="（填入：堡垒机账号与地址）"

# 隧道清单：逗号分隔，每条 label:本地端口:目标主机:目标端口
# label 用于 status/doctor 输出与审计；本地端口建议加 1 万偏移避免与本机服务冲突。
# 常见三条（按需增删）：
#   db    研发库（MySQL 3306 / PostgreSQL 5432）——连接串里的账号必须是只读账号（只授 SELECT）
#   jdwp  JVM 远程调试端口（服务端 address，见 references/remote-debug-jvm.md）
#   logs  日志机 SSH 端口（tail/grep 远端日志走 ops-readonly-guard 判定，一般无需单独转发）
TUNNELS="（填入：如 db:15432:db-internal.rd:5432,jdwp:15005:app-internal.rd:5005）"

# 本地绑定地址：恒 127.0.0.1（不暴露局域网；改掉等于把研发环境端口暴露出去，勿改）
LOCAL_BIND="127.0.0.1"

# ssh 可执行文件与附加选项（默认已含转发失败即退/保活三项，一般不改）
SSH_BIN="ssh"
SSH_OPTS="-o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
