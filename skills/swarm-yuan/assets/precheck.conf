# precheck.conf — precheck.sh 核心配置（物理三分：core/arch/compliance）
# 生成目标技能时，把此文件复制到 .claude/skills/<skill>/scripts/ 并按项目实际填充。
# precheck.sh 启动时自动 source 本文件（若存在）；本文件末尾按存在性 source 两个兄弟：
#   precheck.arch.conf       架构 18 门禁 + 框架适配变量（standard 及以上 profile）
#   precheck.compliance.conf 合规 13 门禁变量（compliance profile / 强监管交付）
# lite profile 只有本文件（核心 11 门禁所需变量）。

# ===== 基础配置（核心 11 门禁）=====
# 关键变量含 # MEASURE: 元数据（GB/T 25000.21-2019 测度元素：characteristic/function/threshold）
# 渐进式——先覆盖核心 11 门禁的关键变量，全量达标后 facts.conf FACT_MEASURE_METADATA_REQUIRED 翻 1
PROJECT_DIR="<项目根绝对路径>"       # MEASURE: characteristic=维护性 function=路径存在性 threshold=非空
BRANCH_REGEX='^(feat|fix|refactor)/.+'  # MEASURE: characteristic=维护性 function=正则匹配 threshold=匹配
# 默认仅 "main" 时 master 基分支仓库零保护
# （git init 默认 master 是真实形态，与 BASE_BRANCH 同族缺口）——双名默认，护不存在的名字无害。
PROTECTED_BRANCHES=("main" "master")   # MEASURE: characteristic=维护性 function=列表包含 threshold=非空
BASE_BRANCH=""                       # MEASURE: characteristic=维护性 function=变更基线引用解析 threshold=空=自动探测（main→master→HEAD~1；master 基分支仓库必须显式配置或依赖探测，硬编码 main 会静默退化 HEAD~1 使 delta 全错）
WRITABLE_DIRS=("<可改目录1>" "<可改目录2>")  # MEASURE: characteristic=维护性 function=目录存在性 threshold=非空
READONLY_DIRS=("<只读目录1>")        # MEASURE: characteristic=安全性 function=只读校验 threshold=非空
TEST_CMD="<test 命令>"               # MEASURE: characteristic=功能性 function=测试通过 threshold=exit0
# ===== 测试质量与覆盖率（check_test 第二层：命令绿 ≠ 测试有效）=====
# 生成期必填：按项目现有基线定阈值（推荐行覆盖 70-85）；确无可解析覆盖率报告则填 0，
# 并在 decisions.jsonl 留痕——空/非数值=未启用，不静默当作通过。
COVERAGE_MIN="（填入行覆盖率阈值，推荐 70-85；暂无覆盖率报告填 0 并留痕）"  # MEASURE: characteristic=功能性 function=行覆盖率 threshold=百分比整数
COVERAGE_REPORT=""                   # MEASURE: characteristic=功能性 function=覆盖率报告定位 threshold=空=自动探测（lcov/jacoco/cobertura/clover/coverage-summary/coverage.out）
TEST_MIN_ASSERTIONS_PER_CASE=1       # MEASURE: characteristic=功能性 function=断言密度 threshold=断言数/用例数（0=关闭；推荐≥1）
TEST_MIN_NEGATIVE_RATIO=20           # MEASURE: characteristic=功能性 function=负向/边界测试占比 threshold=百分比（0=关闭；推荐≥20）
TEST_QUALITY_STRICT=1                # MEASURE: characteristic=功能性 function=测试质量阻断阈值 threshold=1=质量问题 fail/0=warn（生成期可下调并留痕）
TEST_ASSERT_EXTRA_PATTERN=""         # MEASURE: characteristic=功能性 function=自定义断言识别 threshold=ERE（项目自定义 assert helper 时补，防误报零断言）
MUTATION_CMD=""                      # MEASURE: characteristic=功能性 function=变异测试有效性 threshold=命令非空=运行（可选，如 npx stryker run；成本高，生成期按需）
MUTATION_MIN_SCORE=0                 # MEASURE: characteristic=功能性 function=变异分数下限 threshold=百分比（0=只报告不判定）
BUILD_CMD="<build 命令>"            # MEASURE: characteristic=功能性 function=构建通过 threshold=exit0
SCAN_DIRS=("<扫描敏感信息的目录>")     # MEASURE: characteristic=安全性 function=目录存在性 threshold=非空
CONSISTENCY_DIRS=("<扫描业务规则/勾稽的目录>")  # MEASURE: characteristic=功能性 function=目录存在性 threshold=非空

# ===== 核心门禁工具链（--sensitive/--security 属核心 11，工具开关随核心档）=====
# 改为 ${VAR:-默认} 形式支持环境变量临时覆盖（便于排障）——原写死赋值会覆盖
# 环境变量，`SECURITY_TOOL=builtin bash precheck.sh --security` 无效，必须改 conf 才能切换。
SENSITIVE_TOOL="${SENSITIVE_TOOL:-auto}"   # MEASURE: characteristic=安全性 function=敏感信息扫描工具选择 threshold=auto/builtin/gitleaks 三选一（auto=有 gitleaks 叠加内置正则族否则内置正则；builtin=强制内置；gitleaks=强制 gitleaks 未装/执行失败自动降级内置）
SENSITIVE_EXCLUDE_GLOBS=()        # MEASURE: characteristic=安全性 function=路径精确豁免 threshold=grep -vF 精确匹配（敏感信息扫描额外豁免的精确文件路径；gitleaks 路径已内置排除测试固件/示例，此为项目级补充）
SECURITY_TOOL="${SECURITY_TOOL:-auto}"     # MEASURE: characteristic=安全性 function=安全扫描工具选择 threshold=auto/builtin/semgrep 三选一（auto=有 semgrep 用 semgrep ERROR 级命中 fail 叠加内置模式族否则内置；builtin=强制内置；semgrep=强制 semgrep 未装/执行失败自动降级内置）

# ===== 门禁工具化（--format json / gate-runs 证据落盘）=====
# GATE_RUNS_DIR 非空时，每门禁执行后向其下 gate-runs.jsonl 追加一行 JSONL
#（ts/gate/status/ids/duration_s，UTC 时间戳；对齐 GB/T 15532 过程文档与
#  standards-compliance.md §F 证据列）。默认空 = 关闭，不影响任何既有输出。
GATE_RUNS_DIR=""                    # MEASURE: characteristic=维护性 function=门禁运行记录目录 threshold=未配置=SKIP（例：".swarm-yuan/gate-runs"；非空时每门禁执行后追加 JSONL 证据）
# 附：--format json 的 SARIF 子集结果默认打印到 stdout 末尾；
#     也可用环境变量 GATE_JSON_OUT 指定落盘文件（环境变量而非 conf 变量，避免机器相关路径入库）。

# ===== 门禁失败捕获门（precheck fail 从"红字"升级为"真拦截"）=====
# GATE_ENFORCE_DENY 非空时，fail-gate-hook.sh（PreToolUse/PostToolUse hook）生效：
# 白名单门禁 fail 后，未修复就继续 Write/Edit 会被 deny（Claude Code 协议级硬拦截）。
# 逗号分隔门禁名（不带 check_ 前缀的语义名均可），或 "all" 表示全部严格门禁。
# 默认核心门禁白名单；置空 = 完全关闭（向后兼容）。
# draft 期（SKILL.md status: draft）自动关闭（骨架期门禁红是常态，拦截会死锁）；
# 改 .swarm-yuan/ 下 conf 与 precheck.sh 本身豁免（修门禁配置的通道）。
# 开启是 UserChallenge 类决策（须决策落痕 trace-log.sh --decision）。
GATE_ENFORCE_DENY="scope,sensitive,security,build,test,branch,consistency,review,reuse,deps"  # MEASURE: characteristic=可靠性 function=门禁失败硬拦截白名单 threshold=默认核心门禁（spec-first 由独立 L0 块处理；空串=显式关闭；仅白名单内 fail 未修复时 deny 后续 Edit/Write）

# ===== 流程前置门（spec 先行的机器强制）=====
# SPEC_REQUIRED=1 时，fail-gate-hook 在 PreToolUse(Write/Edit) 命中可写源码区（WRITABLE_DIRS）
# 但当前分支无已批准 spec 文件 → deny。spec 位置约定：项目根 docs/specs/*.md（SPEC_GLOB 可覆盖）。
# "已批准"判定：spec 含「## 决策记录」段且非全占位符（骨架铁律同款）。
# 默认 1 = 开启（流程强制的核心卖点）；draft 骨架期自动放行（骨架期无 spec 是常态）。
SPEC_REQUIRED="${SPEC_REQUIRED:-1}"        # MEASURE: characteristic=可靠性 function=spec 前置拦截 threshold=1=开启/0=关闭（流程性约束缺失的根因修复）
SPEC_GLOB="${SPEC_GLOB:-docs/specs/*.md}"  # MEASURE: characteristic=可靠性 function=spec 文件位置 threshold=glob 非空（相对 PROJECT_DIR；默认 docs/specs/*.md）
# 状态机阶段产物锚（state-machine.sh 准入门读取；默认 .swarm-yuan/proposal.md）。
# spec 落 docs/specs/ 时取消下两行注释指向实际文件——design 准入须 proposal、build 准入须 tasks。
# PROPOSAL_FILE="docs/specs/<slug>.md"   # open 阶段产物路径（相对 PROJECT_DIR）
# TASKS_FILE=".swarm-yuan/tasks.md"      # plan 阶段产物路径（相对 PROJECT_DIR）
# 口径注记：SPEC_GLOB 是 spec 位置的唯一约定——check_reuse/check_impact 的
# 发现逻辑已统一走它（旧 specs/spec.md 路径仅作兼容兜底）；check_review 第二段独立审查硬门
# 由 compliance 套的 REVIEW_RECORD_REQUIRED=1 启用（默认 warn 不 fail），产物落
# .claude/skills/<name>/references/review-record.md。

# Bash 推进态命令拦截（默认空=不拦 Bash，避免误伤只读/诊断命令）。
# 白名单支持三种形式：cmd_first 兜底（"git" 拦所有 git 子命令）/ cmd_first:cmd_second 精确（"git:push"）/ cmd_second 单独（"push" 拦所有 "X push Y"）。
# 推进态命令建议白名单：push,commit,merge,release,deploy,publish；不拦只读（status/log/diff/ls/cat/grep）与诊断（test/build/lint）。
# deny 事件落盘 .swarm-yuan/gate-deny.jsonl（G1 决策治理审计留痕）。
GATE_ENFORCE_DENY_BASH=""           # MEASURE: characteristic=可靠性 function=门禁失败硬拦截推进态命令白名单 threshold=未配置=关闭（例："push,commit,merge" 或 "git:push,npm:publish"）

# ===== 机械 vs AI 审边界 =====
# advisory 档中 4 个门禁（cognition/pr_quality/consistency/link_depth）本质是
# "AI 读代码即可判断"的质量类检查，机械 grep 启发式误报高，恒走 _ai_hint 自查要点。
# diagram 两层：客观契约（可访问 SVG/单文件安全/远程资源/脚本策略/viewBox）由
# diagram-check.sh 机械查并在有效层以 warn 阻断；选型/密度/可读性由 AI 检查单判断。
# GATE_AI_JUDGMENT 保留为兼容别名（旧 conf 设 0/1 均不影响上述行为）。
# 边界原则：strict 档信号可信保持机械；warn/advisory 输出由 AI 判断采纳，不必全修。
GATE_AI_JUDGMENT="${GATE_AI_JUDGMENT:-0}"  # MEASURE: characteristic=易用性 function=advisory档质量门禁AI自觉判断开关 threshold=兼容别名（cognition/pr_quality/consistency/link_depth 恒 AI 检查单；diagram 客观契约机械查）

# ===== profile 分层：兄弟配置存在即加载 =====
# precheck.sh 的 conf 加载以 set +u 包裹本文件，兄弟 source 继承同一语义；
# ===== 深度整合构建触发 =====
# 消费门禁（check_impact/check_layer/check_link_depth）在 has_* + indexed/built 双守卫后调用；
# 若未构建（gitnexus_indexed=0 或 graphify_built=0），默认 warn 提示用户手动构建，
# 设 BUILD_DEEP_RUNTIMES=1 则门禁自动触发构建（gitnexus analyze / graphify update，分钟级重型操作）。
# 默认 0 = 不自动构建（避免每次门禁拖慢 CI）；1 = 自动构建（opt-in）。
BUILD_DEEP_RUNTIMES="${BUILD_DEEP_RUNTIMES:-0}"  # MEASURE: characteristic=易用性 function=深度整合自动构建开关 threshold=0=手动构建（默认）/1=自动构建（分钟级）

# BASH_SOURCE 定位本文件所在目录，三平台兼容（bash 3.2 可用）。
_conf_self_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# [[ -f ]] && source 作为 conf 末条语句时，文件不存在会使整行返回 1，
# 在 set -e 下成为 source 本 conf 的返回值并触发 precheck.sh 退出。末尾 || true 兜底。
[[ -f "$_conf_self_dir/precheck.arch.conf" ]] && source "$_conf_self_dir/precheck.arch.conf" || true
[[ -f "$_conf_self_dir/precheck.compliance.conf" ]] && source "$_conf_self_dir/precheck.compliance.conf" || true
# F3（dsh 吸收·分层 patch 最小步）：用户覆盖层——后 source 即胜出，用户不直接改生成的
# conf 文件（根治升级漂移：upgrade 保留用户配置的判定不再依赖"文件被手改"启发式）。
[[ -f "$_conf_self_dir/precheck.patch.conf" ]] && source "$_conf_self_dir/precheck.patch.conf" || true
