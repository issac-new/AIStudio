# .swarm-yuan/hooks/precheck.conf — L2 提交钩子最小判定面（2026-10-30 HelixHarness 吸收轮）
#
# 为什么有这个文件：判定库与提交钩子已随生成器渲染到本目录（_fg_render_l2_kit），
# 但 spec-first-pre-commit.sh 还需同目录 conf 才拿得到 WRITABLE_DIRS/SPEC_GLOB 等判据；
# 此前 fresh clone 缺这份 conf → 钩子在「conf 缺失」处 fail-open，宣称的四层强制只剩 L1/L3。
#
# 单一事实源与对账：
#   - 判定逻辑单一事实源 = skills/swarm-yuan/assets/spec-first-lib.sh（本文件不含任何判据代码）。
#   - 与目标技能 conf（.claude/skills/*/scripts/precheck.conf）的共享键**值**必须一致；
#     custom/__tests__/l2-kit-parity.test.ts 在两者并存时逐值对账，漂移即红。
#   - 本文件只放 L2 所需的最小键；门禁/构建/依赖等其余配置仍在目标技能 conf。

BASE_BRANCH="main"
WRITABLE_DIRS=("custom" "registries" "config" "scripts" "patches" "zcode-patches" "runtime" "docs")

SPEC_REQUIRED="${SPEC_REQUIRED:-1}"
SPEC_GLOB="${SPEC_GLOB:-docs/superpowers/specs/*.md}"

DESIGN_SYNC_REQUIRED="${DESIGN_SYNC_REQUIRED:-1}"
DESIGN_DOCS=("docs/superpowers/specs/2026-10-23-swarmstudio-integrated-design.md" "docs/superpowers/specs/2026-10-23-swarmstudio-design-ledger.md")

# 新增能力开关走环境变量覆盖（不落 conf，避免 conf 变量预算棘轮 FACT_CONF_VARS 抬档）：
#   SPEC_SECTIONS_ENFORCE=warn|block   四段机检档位（默认 warn）
#   SPEC_RECEIPT_ENFORCE=warn|block    spec 内容收据漂移档位（默认 warn）
#   SPEC_REBIND=1                      显式重绑已合入 spec 的收据（授权修订留痕）
