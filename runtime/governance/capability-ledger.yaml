# 能力台账（4A 治理层单一事实源之一）
#
# 定位：本机智能体协作的"能力地图 + 应用台账"合一本——L1 能力域 / L2 能力项
# （能力=业务对象+动作）/ L3 能力单元（主承载认定落点）。设计依据：
# docs/superpowers/specs/2026-09-29-agent-4a-governance-layer-design.md §3.1。
#
# 纪律：
# - 只登记治理维度（主责/生命周期/SLO 档/复核日/实物锚点），不复制各制品内容
#   （提示词、协议 schema 等以 refs 指向的实物为准，防第二事实源）。
# - 每个 L2 恰好一个 primary: true 的 L3（一项能力只认一个主责，守门断言）。
# - reviewedAt 为保鲜字段：超 90 天守门 warn；改条目必刷新本行与文件头。
# - refs.file 路径相对 overlay 仓根；refs.note 用于无单文件锚点的条目。
# - kind 词表：lane-specialist（泳道专家）| roster-role（名册角色）| squad（小队）
#   | coding-agent（执行底座）| team（编制分组）| service（服务件，预留）。

version: 1
reviewedAt: "2026-09-29"

# L1 能力域（投什么四象限的承载层）
domains:
  - id: requirements
    name: 需求与拆解
    owner: cuishi
  - id: engineering
    name: 开发实现
    owner: cuishi
  - id: quality
    name: 质量评审
    owner: cuishi
  - id: release
    name: 发布与运维
    owner: cuishi
  - id: collaboration
    name: 协作与协调
    owner: cuishi

# L2 能力项（能力=对象+动作；importance/maturity 供"投什么"四象限评估）
capabilities:
  - id: req.decompose
    domain: requirements
    name: 任务拆解
    object: 需求
    action: 拆解
    importance: core
    maturity: high
  - id: req.refine
    domain: requirements
    name: 卡片精化
    object: 任务卡
    action: 精化
    importance: core
    maturity: high
  - id: req.research
    domain: requirements
    name: 调研取证
    object: 问题
    action: 调研
    importance: support
    maturity: medium
  - id: req.design
