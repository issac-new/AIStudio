    name: 体验设计
    object: 交互
    action: 设计
    importance: support
    maturity: medium
  - id: eng.implement
    domain: engineering
    name: 卡片实现
    object: 任务卡
    action: 实现
    importance: core
    maturity: high
  - id: eng.facade
    domain: engineering
    name: 触点实现
    object: 界面
    action: 实现
    importance: core
    maturity: medium
  - id: eng.unblock
    domain: engineering
    name: 阻塞解除
    object: 阻塞卡
    action: 解除
    importance: support
    maturity: medium
  - id: eng.orchestrate
    domain: engineering
    name: 待办编排
    object: 待办列
    action: 编排
    importance: support
    maturity: medium
  - id: eng.publish
    domain: engineering
    name: 变更发布
    object: 变更
    action: 发布
    importance: core
    maturity: medium
  - id: quality.review
    domain: quality
    name: 代码评审
    object: 变更
    action: 评审
    importance: core
    maturity: high
  - id: quality.test
    domain: quality
    name: 前端验证
    object: 界面
    action: 验证
    importance: core
    maturity: medium
  - id: quality.flow
    domain: quality
    name: 流程分析
    object: 看板流
    action: 分析
    importance: support
    maturity: low
  - id: release.report
    domain: release
    name: 完成报告
    object: 交付
    action: 报告
    importance: core
    maturity: high
  - id: release.ops
    domain: release
    name: 运行维护
    object: 运行时
    action: 维护
    importance: support
    maturity: medium
  - id: collab.coordinate
    domain: collaboration
    name: 团队协调
    object: 团队
    action: 协调
    importance: core
    maturity: medium
  - id: collab.execute
    domain: collaboration
    name: 委派执行
    object: 委派任务
    action: 执行
    importance: core
    maturity: high

