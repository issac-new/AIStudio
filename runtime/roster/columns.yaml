# Ycode 看板列编排（routa §七#1 KanbanColumnAutomation 语义，矩阵 §3.6 P0）
# 每列：automation.steps（有序步骤：id/role/specialist/provider）+ 触发时机
# entry|exit|both + autoAdvanceOnSuccess（步骤全成后的进列意图——完成后由人工/
# 编排推进列，本层无自动进列执行面）。
# 执行语义：同 provider 多步合并进单 run 按序执行（单 pending 槽）；跨 run 串行
# 依赖 run 完成信号（未接）。
# 校验：provider 限词表（zcode）；id/role/specialist 限 [A-Za-z0-9._-] 且 ≤64 字符
# ——这些字段拼进派单文本，违规 step 加载 warn、派发时拒绝（400 配置错误）。
# 契约门四件套（requiredHumanApproval/checklist/validator/gateMode）已由
# kanban_gates.py（patch 399）在流转侧强制，本表只管编排触发，不重复门禁。
# 维护：role/specialist 对齐 runtime/roster/squads.yaml 与 agent-roster 角色目录。
# 列名约束（2026-11-19 流程地基批）：键必须落在看板九态内——正本=kernel
# kanban_workflow.py 的 DEFAULT_WORKFLOW（triage/todo/scheduled/ready/running/
# blocked/review/done/archived），overlay 消费面常量=custom/server/kanban/
# kanban-status.ts，漂移由 __tests__/kanban-status-contract.test.ts 拦截。
# 触发面是前端拖卡成功后的 /api/column-automation/dispatch（传真实 from/to），
# 因此只有可拖入的列才会命中：running 由 dispatcher 认领写出且 drag_target=False，
# 挂 running 只会自触发，故「实现」步骤挂 ready。
columns:
  todo:
    timing: entry
    autoAdvanceOnSuccess: true
    steps:
      - id: refine
        role: general-engineer
        specialist: backlog-refiner
        provider: zcode
  # 「实现」步骤：进 ready 表示卡已具备派发资格，此时派实现方。
  # 历史键为 in_progress（旧列模型），该列不在看板九态内，恒不命中（2026-11-19 修正）。
  ready:
    timing: entry
    autoAdvanceOnSuccess: false
    steps:
      - id: implement
        role: backend
        specialist: dev-crafter
        provider: zcode
  review:
    timing: entry
    autoAdvanceOnSuccess: false
    steps:
      - id: qa
        role: qa
        specialist: review-guard
        provider: zcode
      - id: approve
        role: code-reviewer
        specialist: review-guard
        provider: zcode
  # 缺陷复测列（原 verify 键，G3 2026-10-11）已删除：看板九态无 verify 列，该键恒不命中。
  # 意图保留待裁决——是新增板列，还是并入 review 的某一步；并入会改变 review 进入时的
  # 派发步数，属行为变更，不在缺陷修复批内猜测。台账见
  # docs/superpowers/specs/2026-11-19-kanban-process-baseline.md 决策 D3。
  done:
    timing: exit
    autoAdvanceOnSuccess: false
    steps:
      - id: report
        role: operations
        specialist: done-reporter
        provider: zcode
