# Ycode squad 名册（单一事实源——multica squad 协议：leader 委托制）
# 语义：@squad/<名> 派单只发给 leader（leader 决定自己做什么/委托成员做什么——
# 选人与分派是 leader 的职责，不是总线替它做）；leader @ 自己的 squad 不再触发
# （自触发抑制，防循环）；每轮派单必录评估（action/no_action/failed+reason）。
# 评估台账：派单交付到 leader run 先记 pending 占位；leader verdict 摄入链路待接
# （输入面未定），实评接入前查询面按 placeholder 区分占位/实评。
# 维护：squad 名与成员 id 对齐 agent 名册（agent-roster.yaml）与 mention 白名单。
squads:
  core:
    leader: zcode
    members: [zcode, codex, mimo]
  review:
    leader: codex
    members: [codex, zcode]
