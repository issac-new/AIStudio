<style>
:root{
  --bg:#f6f8fb; --card:#ffffff; --text:#1e293b; --muted:#64748b;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e2e8f0;
  --code-bg:#0f172a; --code-text:#e2e8f0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:15px; line-height:1.78;
  display:grid; grid-template-columns:264px minmax(0,1fr); gap:0 36px;
  max-width:1360px; margin:0 auto; padding:0 28px 80px;
}
header#title-block-header{grid-column:1 / -1; padding:34px 6px 6px}
header#title-block-header h1.title{
  font-size:26px; line-height:1.4; margin:0; padding:18px 22px;
  background:linear-gradient(135deg,#0f172a,#1e3a5f); color:#fff; border-radius:14px;
  box-shadow:0 6px 18px rgba(15,23,42,.14);
}
/* ── 左侧粘性目录 ── */
nav#TOC{
  position:sticky; top:0; align-self:start;
  max-height:100vh; overflow:auto; padding:26px 4px 30px 0;
  border-right:1px solid var(--border); font-size:12.5px;
  scrollbar-width:thin;
}
nav#TOC::before{
  content:"目录"; display:block; font-weight:700; font-size:13px;
  color:var(--muted); letter-spacing:.08em; margin-bottom:10px;
}
nav#TOC ul{list-style:none; margin:0; padding-left:0}
nav#TOC ul ul{padding-left:14px; border-left:1px dashed var(--border); margin-left:2px}
nav#TOC li{margin:2px 0}
nav#TOC a{
  display:block; padding:4px 10px; border-radius:8px; color:var(--muted);
  text-decoration:none; line-height:1.5; word-break:break-all;
}
nav#TOC a:hover{background:var(--accent-soft); color:var(--accent)}
/* ── 正文 ── */
body > *:not(header#title-block-header):not(nav#TOC){grid-column:2}
main, body{min-width:0}
h1,h2,h3,h4{scroll-margin-top:18px; color:#0f172a; font-weight:700}
h2{
  font-size:20px; margin:2.4em 0 .9em; padding:.2em 0 .45em;
  border-bottom:2px solid var(--border); position:relative;
}
h2::before{
  content:""; position:absolute; left:0; bottom:-2px; width:64px; height:2px; background:var(--accent);
}
h3{font-size:16.5px; margin:1.8em 0 .7em; color:#1d4ed8}
h4{font-size:14.5px; margin:1.4em 0 .6em; color:#334155}
p{margin:.7em 0}
a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--accent)}
strong{color:#0f172a}
hr{border:none; border-top:1px dashed var(--border); margin:2em 0}
blockquote{
  margin:1.1em 0; padding:12px 18px; border-left:4px solid #93c5fd;
  background:#eff6ff; border-radius:0 10px 10px 0; color:#334155;
}
blockquote p{margin:.35em 0}
/* ── 表格 ── */
table{
  border-collapse:collapse; width:100%; margin:1.1em 0;
  font-size:13px; line-height:1.6; background:var(--card);
  border:1px solid var(--border); border-radius:10px; overflow:hidden;
  display:table;
}
thead th{
  background:#f1f5f9; color:#0f172a; font-weight:700; text-align:left;
  padding:8px 12px; border-bottom:2px solid var(--border); white-space:nowrap;
}
td{padding:7px 12px; border-bottom:1px solid #eef2f7; vertical-align:top}
tbody tr:nth-child(even){background:#fafcfe}
tbody tr:hover{background:var(--accent-soft)}
/* ── 代码 ── */
code{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:.9em;
  background:#f1f5f9; color:#b45309; padding:1px 6px; border-radius:6px; word-break:break-all;
}
pre{
  background:var(--code-bg); color:var(--code-text); border-radius:12px;
  padding:14px 18px; overflow-x:auto; line-height:1.6; font-size:12.5px;
  box-shadow:0 4px 14px rgba(15,23,42,.12);
}
pre code{background:none; color:inherit; padding:0}
/* ── 细节 ── */
ul,ol{padding-left:1.5em}
li{margin:.3em 0}
img{max-width:100%; border-radius:10px}
@media (max-width:980px){
  body{grid-template-columns:1fr; padding:0 14px 60px}
  nav#TOC{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--border)}
  body > *:not(header#title-block-header):not(nav#TOC){grid-column:1}
}
@media print{
  body{display:block; background:#fff; max-width:none; padding:0}
  nav#TOC{display:none}
  pre{box-shadow:none}
}
</style>
<style>
/* ── 公文增强：导读卡/术语卡/首现释义/徽标 ── */
.gw-daodu{grid-column:2; margin:18px 0 6px; background:linear-gradient(135deg,#f0f7ff,#f8fafc);
  border:1px solid #bfdbfe; border-left:5px solid #2563eb; border-radius:12px; padding:16px 20px}
.gw-daodu-hd{font-weight:700; font-size:15px; color:#1e3a8a; margin-bottom:8px}
.gw-daodu-body p{margin:.45em 0; font-size:13.5px; color:#334155}
.gw-daodu-body b{color:#0f172a}
.gw-kpis{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.gw-kpi{background:#fff; border:1px solid var(--border); border-radius:10px; padding:8px 14px; text-align:center; min-width:86px}
.gw-kpi b{display:block; font-size:19px; color:#1d4ed8; line-height:1.2}
.gw-kpi span{font-size:11px; color:var(--muted)}
.gw-terms{grid-column:2; margin:6px 0 14px; border:1px dashed #cbd5e1; border-radius:12px;
  background:#fbfdff; padding:10px 16px}
.gw-terms summary{cursor:pointer; font-weight:700; font-size:13px; color:#475569}
.gw-terms-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 28px; margin-top:10px}
.gw-terms dt{font-weight:700; font-size:12.5px; color:#0f172a; margin-top:8px}
.gw-terms dd{margin:1px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6}
span.term{border-bottom:1px dotted #2563eb; cursor:help}
.gw-badge{display:inline-block; margin-left:10px; padding:2px 10px; border-radius:999px;
  background:#fef3c7; color:#92400e; font-size:11.5px; font-weight:600; vertical-align:middle}
@media (max-width:980px){.gw-daodu,.gw-terms{grid-column:1}.gw-terms-grid{grid-template-columns:1fr}}
</style>
<style>
/* ── 26 步主链卡片 ── */
.step-card{background:#fff;border:1px solid var(--border);border-radius:12px;margin:12px 0;
  box-shadow:0 2px 8px rgba(15,23,42,.05);overflow:hidden}
.step-hd{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#f8fafc;
  border-bottom:1px solid var(--border)}
.step-no{min-width:32px;height:32px;border-radius:9px;background:#2563eb;color:#fff;
  font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.step-card[data-gate] .step-no{background:#b45309}
.step-title{font-weight:700;font-size:14px;color:#0f172a}
.gate-chip{margin-left:auto;padding:2px 10px;border-radius:999px;background:#fef3c7;
  color:#92400e;font-size:11px;font-weight:600;white-space:nowrap}
.step-sec{padding:8px 16px 10px;border-bottom:1px dashed #eef2f7}
.step-sec:last-child{border-bottom:none;padding-bottom:14px}
.step-sec-hd{font-size:11px;font-weight:700;color:#2563eb;letter-spacing:.06em;margin-bottom:3px}
.step-sec p{margin:0;font-size:13px;line-height:1.75}
/* ── mermaid 图容器 ── */
div.mermaid{background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:16px;margin:14px 0;overflow-x:auto;text-align:center}
</style>
<style>
/* 正文首题头紧凑化（2026-10-08 审阅反馈：h1 与文档定位间空白过大） */
body > h1{font-size:21px;margin:0;padding:6px 0 10px;border-bottom:2px solid var(--border);color:#0f172a}
body > h1 + blockquote{margin-top:10px}
.gw-terms{margin-bottom:10px}
</style>
