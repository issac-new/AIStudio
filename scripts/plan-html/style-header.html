<style>
/* ── 基础与版式（tokens 见前置 tokens.css；单源=overlay/scripts/plan-html/）── */
html{color-scheme:light;scroll-behavior:smooth}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:var(--fs-body); line-height:1.78;
  display:grid; grid-template-columns:264px minmax(0,1fr); gap:0 40px;
  max-width:none; margin:0 auto; padding:0 24px 80px;
}
::selection{background:var(--accent-soft)}
header#title-block-header{grid-column:1 / -1; padding:34px 0 6px}
header#title-block-header h1.title{
  font-size:26px; line-height:1.4; margin:0; padding:18px 24px;
  background:var(--grad-hero); color:#fff; border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);
}
/* ── 左侧粘性目录 ── */
nav#TOC{
  position:sticky; top:0; align-self:start;
  max-height:100vh; overflow:auto; padding:26px 4px 30px 0;
  border-right:1px solid var(--line); font-size:12.5px;
  scrollbar-width:thin; scrollbar-color:var(--line) transparent;
}
nav#TOC::before{
  content:"目录"; display:block; font-weight:700; font-size:13px;
  color:var(--muted); letter-spacing:.08em; margin-bottom:10px;
}
nav#TOC ul{list-style:none; margin:0; padding-left:0}
nav#TOC ul ul{padding-left:14px; border-left:1px dashed var(--line); margin-left:2px}
nav#TOC li{margin:2px 0}
nav#TOC a{
  display:block; padding:4px 10px; border-radius:8px; color:var(--muted);
  text-decoration:none; line-height:1.5; word-break:break-word;
}
nav#TOC a:hover{background:var(--accent-soft); color:var(--accent)}
/* ── 正文（enhance2 ③ 归拢后：nav 独占左列第 2 行，其余正文全在 main 内顺序流式）──
   行宽上限=--measure：宽屏不再一行通到屏幕右缘（2026-10-10 版式修复头号项） */
nav#TOC{grid-column:1; grid-row:2}
main.doc-main{grid-column:2; grid-row:2; max-width:var(--measure)}
main, body{min-width:0}
h1,h2,h3,h4{scroll-margin-top:18px; color:var(--ink-strong); font-weight:700}
h2{
  font-size:var(--fs-h2); margin:2.2em 0 .85em; padding:.2em 0 .45em;
  border-bottom:2px solid var(--line); position:relative;
}
h2::before{
  content:""; position:absolute; left:0; bottom:-2px; width:64px; height:2px; background:var(--accent);
}
h3{font-size:var(--fs-h3); margin:1.8em 0 .7em; color:var(--accent-deep)}
h4{font-size:var(--fs-h4); margin:1.4em 0 .6em; color:var(--ink-strong)}
p{margin:.7em 0}
a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--accent)}
strong{color:var(--ink-strong)}
hr{border:none; border-top:1px dashed var(--line); margin:2em 0}
/* 引言块=中性导读（蓝洗改中性，语义强调交给 .gw-daodu 卡） */
blockquote{
  margin:1.1em 0; padding:12px 18px; border-left:4px solid var(--line);
  background:var(--surface-2); border-radius:0 var(--radius) var(--radius) 0; color:var(--ink);
}
blockquote p{margin:.35em 0}
/* ── 表格（enhance2 ④ 起外套 .tbl-wrap 横滚，宽表不再挤压正文）── */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.tbl-wrap > table, table{
  border-collapse:collapse; width:100%; margin:1.1em 0;
  font-size:13px; line-height:1.6; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  display:table;
}
thead th{
  background:var(--surface-3); color:var(--ink-strong); font-weight:700; text-align:left;
  padding:8px 12px; border-bottom:2px solid var(--line);
}
td{padding:7px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
/* 首列下限：CJK 逐字断行使短标签列可被压成单字竖排（「贴近真/实」型折行），4em 下限兜住 */
td:first-child{min-width:4em}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:hover{background:var(--accent-soft)}
/* ── 代码：行内码=中性（旧琥珀棕刺眼已撤），块码=深色卡片 ── */
code{
  font-family:var(--font-mono); font-size:.9em;
  background:var(--surface-3); color:var(--ink-strong);
  padding:1px 6px; border-radius:6px; border:1px solid var(--line-soft);
  word-break:break-word;
}
pre{
  background:var(--code-bg); color:var(--code-ink); border-radius:12px;
  padding:14px 18px; overflow-x:auto; line-height:1.6; font-size:12.5px;
  box-shadow:var(--shadow-sm);
}
pre code{background:none; color:inherit; padding:0; border:none}
/* ── 细节 ── */
ul,ol{padding-left:1.5em}
li{margin:.3em 0}
img{max-width:100%; border-radius:var(--radius)}
@media (max-width:980px){
  body{grid-template-columns:1fr; padding:0 16px 60px}
  nav#TOC{position:static; max-height:none; border-right:none; border-bottom:1px solid var(--line)}
  main.doc-main{grid-column:1; grid-row:auto; max-width:none}
}
@media print{
  body{display:block; background:#fff; max-width:none; padding:0}
  nav#TOC{display:none}
  pre{box-shadow:none}
}
</style>
<style>
/* ── 公文增强：导读卡/术语卡/首现释义/徽标 ── */
.gw-daodu{margin:18px 0 6px; background:linear-gradient(135deg,var(--accent-soft),var(--surface));
  border:1px solid var(--accent-soft); border-left:5px solid var(--accent); border-radius:12px; padding:16px 20px}
.gw-daodu-hd{font-weight:700; font-size:15px; color:var(--accent-deep); margin-bottom:8px}
.gw-daodu-body p{margin:.45em 0; font-size:13.5px; color:var(--ink)}
.gw-daodu-body b{color:var(--ink-strong)}
.gw-kpis{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.gw-kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; text-align:center; min-width:86px}
.gw-kpi b{display:block; font-size:19px; color:var(--accent); line-height:1.2}
.gw-kpi span{font-size:11px; color:var(--muted)}
.gw-terms{margin:6px 0 14px; border:1px dashed var(--line); border-radius:12px;
  background:var(--surface-2); padding:10px 16px}
.gw-terms summary{cursor:pointer; font-weight:700; font-size:13px; color:var(--muted)}
.gw-terms-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 28px; margin-top:10px}
.gw-terms dt{font-weight:700; font-size:12.5px; color:var(--ink-strong); margin-top:8px}
.gw-terms dd{margin:1px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6}
span.term{border-bottom:1px dotted var(--accent); cursor:help}
.gw-badge{display:inline-block; margin-left:10px; padding:2px 10px; border-radius:999px;
  background:var(--warn-soft); color:var(--warn); font-size:11.5px; font-weight:600; vertical-align:middle}
@media (max-width:980px){.gw-terms-grid{grid-template-columns:1fr}}
</style>
<style>
/* ── 26 步主链卡片 ── */
.step-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin:12px 0;
  box-shadow:var(--shadow-sm); overflow:hidden}
.step-hd{display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--surface-2);
  border-bottom:1px solid var(--line)}
.step-no{min-width:32px; height:32px; border-radius:9px; background:var(--accent); color:#fff;
  font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px}
.step-card[data-gate] .step-no{background:var(--warn)}
.step-title{font-weight:700; font-size:14px; color:var(--ink-strong)}
.gate-chip{margin-left:auto; padding:2px 10px; border-radius:999px; background:var(--warn-soft);
  color:var(--warn); font-size:11px; font-weight:600; white-space:nowrap}
.step-sec{padding:8px 16px 10px; border-bottom:1px dashed var(--line-soft)}
.step-sec:last-child{border-bottom:none; padding-bottom:14px}
.step-sec-hd{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.06em; margin-bottom:3px}
.step-sec p{margin:0; font-size:13px; line-height:1.75}
/* ── mermaid 图容器 ── */
div.mermaid{background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:16px; margin:14px 0; overflow-x:auto; text-align:center}
</style>
<style>
/* 正文首题头紧凑化（2026-10-08 审阅反馈：grid 行拉伸根治后的收边距） */
.doc-main > h1{font-size:21px; margin:0; padding:2px 0 8px; border-bottom:2px solid var(--line); color:var(--ink-strong)}
.doc-main > h1 + blockquote{margin-top:6px}
.gw-terms{margin-bottom:6px}
</style>
