# 本仓变更面声明（L0.scope-check 输入）——「作业区围栏」，不是逐批清单。
#
# 语义（2026-11-12 设计复盘 P0-3 重定义）：
#   - 本文件只声明「仓库的作业区」：哪些顶层目录/根文件属于本仓的可改面。
#     围栏的价值是挡住不该出现的路径（临时文件、外部目录、机器特定文件被误提交）。
#   - 它不再是「本批次的预期改动面」。旧做法每批追加具体文件路径，4 周从 19 行长到 848 行、
#     721 条（含 70 条 ** 宽 glob），「超出即 FAIL」逐日变宽直至失效，且每次变更都要登记。
#   - 批次级范围纪律交给 task-intent（`qgate intent` 写 .qgate/registers/task-intent.json）：
#     登记了意图时，本门自动取「围栏 ∩ 意图 scope」；未登记时只查围栏。
#   - 围栏条目只允许「目录/**」或下方列出的根文件；禁止再追加具体文件路径
#     （custom/__tests__/qgate-repo-scope-fence.test.ts 守门，条目上限 60）。
paths:
  - custom/**
  - docs/**
  - scripts/**
  - patches/**
  - zcode-patches/**
  - simharness/**
  - runtime/**
  - skills/**
  - team/**
  - config/**
  - registries/**
  - assets/**
  - evidence/**
  - .qgate/**
  - .swarm-yuan/**
  - .github/**
  - .archived-patches/**
  - vendor/**
  # 根文件（仓库级配置与入口，不属于任何目录）
  - AGENTS.md
  - README.md
  - RELEASE-NOTES.md
  - RELEASE-MANIFEST.json
  - package.json
  - package-lock.json
  - runtime-manifest.json
  - vite.config.overlay.mts
  - vitest.config.ts
  - tsconfig.json
  - tsconfig.client.json
  - .gitignore
  - .gitattributes
  - .npmrc
  - .gitleaks.toml
  - .env.example
