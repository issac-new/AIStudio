# 项目覆盖内置门：同 id 覆盖（loader 纪律）。advisory 档——见 ../qgate.yaml 头注释。
apiVersion: qgate/v1alpha1
kind: Gate
metadata:
  id: engineering.basic-check
  version: 0.1.0-overlay
  description: overlay 仓工程基线（advisory 起步）：lint+全量 vitest。
spec:
  domain: L1
  claims:
    - engineering.lint-clean
  appliesWhen:
    changed:
      any:
        - "custom/**"
        - "patches/**"
        - "scripts/**"
  triggers:
    - task_close
    - pre_commit
    - release
  executors:
    - id: test
      type: command
      # junit reporter 落盘 → 内核独立重解析重算计数（R0 接线，v0.3 §3.1）：
      # 退出码 0 但报告含失败 / 套件静默缩水（< minTotal）→ INCONCLUSIVE，不给假绿
      command: ["npm", "test", "--silent", "--", "--reporter=junit", "--outputFile=.qgate/junit-report.xml"]
      rawOutput:
        format: junit
        file: ".qgate/junit-report.xml"
        minTotal: 100
      evidenceType: unit-test-result
      timeoutMs: 600000
  evidence:
    required:
      - unit-test-result
  policy:
    failure: warn
    inconclusive: warn
    allowWaiver: true
    maxAgeHours: 24
