# 项目覆盖内置门：同 id 覆盖（loader 纪律）。全量测试门=block（2026-11-05 治理可信度修复：
# 全量 7820 passed 基线确认后升档；此前 advisory 档导致 2026-10-02 的旧 PASS 长期占位）。
apiVersion: qgate/v1alpha1
kind: Gate
metadata:
  id: engineering.basic-check
  version: 0.1.0-overlay
  description: overlay 仓全量测试门（block）：lint+全量 vitest，junit 计数防缩水。
spec:
  domain: L1
  claims:
    - engineering.lint-clean
  appliesWhen:
    changed:
      any:
        - "custom/**"
        - "patches/**"
        - "scripts/**"
  triggers:
    - task_close
    - pre_commit
    - release
  executors:
    - id: test
      type: command
      # junit reporter 落盘 → 内核独立重解析重算计数（R0 接线，v0.3 §3.1）：
      # 退出码 0 但报告含失败 / 套件静默缩水（< minTotal）→ INCONCLUSIVE，不给假绿
      command: ["npm", "test", "--silent", "--", "--reporter=junit", "--outputFile=.qgate/junit-report.xml", "--no-file-parallelism"]
      rawOutput:
        format: junit
        file: ".qgate/junit-report.xml"
        minTotal: 7600
      evidenceType: unit-test-result
      # 2026-11-11 v1.0.15 发布轮校准：套件 7600→8726 后 --no-file-parallelism 串行墙钟
      # 实测 ~11 分钟（junit time_sum 352s＋transform/collect 串行开销），600s 撞线连三
      # executor-error（套件本身 0 失败）。抬到 20 分钟双倍裕量；minTotal 收缩守门不受影响。
      timeoutMs: 1200000
  evidence:
    required:
      - unit-test-result
  policy:
    failure: block
    inconclusive: warn
    allowWaiver: true
    maxAgeHours: 24
