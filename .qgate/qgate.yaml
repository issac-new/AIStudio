# QGate 项目配置——overlay 仓自备（零 init：clone 即生效，勿提交 runs/evidence 等运行数据）。
# 档位从 advisory 起步：全量套件结果受 upstream 注入态影响（zcode-patches-guard 等
# 注入态守门在未注入树上按设计必红），故 basic-check 先 warn 观察，稳定后再切 block。
# 触发面（2026-10-30 HelixHarness 吸收轮补齐）：门的 triggers 声明此前无执行点——提交链
# 从不调用 qgate。现由 .swarm-yuan/hooks/pre-push 执行 plan 输出的 L0 门集
# （trigger 传 pre_commit，即"提交时该跑的门"在推送前本地实跑），默认拦截；
# QGATE_PREPUSH_ENFORCE=0 降级为告警。engineering.basic-check 等全量测试门仍留给 merge 前
# npm test（pre-push 跑分钟级全量不可接受）。
profile: vibe-fast
claims:
  - id: engineering.lint-clean
    statement: overlay 自身代码通过 lint 与全量测试链。
    domain: L1
    criticality: medium
  # 2026-11-05 组织治理能力批：治理刻度契约（advisory 起步，见 gates/governance.orgscale.yaml）
  - id: orgscale.spec-six-questions
    statement: 自治/假设/度量三域判定面与守门测试在位，且 spec 模板保留批准前六问。
    domain: L4
    criticality: medium
# 档位后强制启用（round-2，控制席裁决 2026-11-06、台账待追认）：orgscale claim 已在
# 上声明，唯一覆盖门 governance.orgscale 属 L4、被 vibe-fast 域级禁用——不覆盖则
# claim 恒孤儿、release:gate 严格报告恒红（2026-11-06 真跑实锤）。仅复活这一门，
# 不动档位其余裁剪面。
enableGates:
  - governance.orgscale
overrides: {}
