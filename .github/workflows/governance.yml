name: governance

# 产品治理门禁（2026-11-05 AI Native 吸收批 T6；2026-11-12 复盘 P1-7 修订）：
# 静态快门（<1min）：governance-lint / merge-invariants —— 纯 node 零依赖，干净环境直接跑。
# typecheck 已移 product-tests.yml（全量链）：typecheck:harness 覆盖 custom/server 全目录后
# 需要 koa/@koa/router 等 11 个类型依赖（vendor lock 内），内联装 typescript 的旧法必红
# （TS2307 存量红实证，run 43169499446）；product-tests 链 npm ci+注入后类型齐备，零额外成本。
# 全量 vitest 同在 product-tests.yml。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 治理静态门（lint + invariants）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: governance-lint --budget
        run: node scripts/governance-lint.mjs --budget
      - name: merge-invariants --check
        run: node scripts/merge-invariants.mjs --check
