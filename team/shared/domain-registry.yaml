version: 1
updated: '2026-10-26'
# 板归属正本：每块看板 = 一个领域团队 + 一位本机人类员工。
# - profiles: 派发围栏（dispatcher 只允许该板团队认领；board.json profile_scope 同源）
# - owner_label: 人类负责人的岗位标签（人读）
# - owner_account_env: 本机账号环境变量名（部署时在 profile .env 配真实 Matrix/studio 账号；
#   仓内不落账号原值，符合脱敏纪律）
domains:
- domain: swarm
  board: swarm
  profiles:
  - orchestrator
  - worker-researcher
  - worker-coder
  - worker-tester
  knowledge:
  - ~/.hermes/delivery/（软件开发交付标准工作模板 v1.0.0，2026-09-17 起；六阶段×六门禁，工具无关）
  target_skill: null
  owner_of_domain: orchestrator
  owner_label: 主管
  owner_account_env: BOARD_OWNER_SWARM
- domain: ops
  board: ops
  profiles:
  - ops-devops
  - ops-sre
  - ops-incident-commander
  - ops-eval
