version: 3
updated: '2026-11-19'
# 团队作用域交接规则（EvoTeam 吸收，spec 2026-11-08-team-library-evolution）
#
# 规则作用域＝(from,to) 列/角色对；from/to 不同名、同一对可有多条不同 trigger 的规则。
# 注入语义＝建议：派单简报附一条命中规则，不阻断派发、不判失败；缺证据照常继续。
# required_evidence 是可判定的键（机器对账用），渲染时附中文标签。
# 版本变化保留 version，退役用 status: retired（不删除历史）。
#
# 列名约束（v2，2026-11-19 流程地基批）：from/to 必须落在看板九态内（正本=kernel
# kanban_workflow.py，消费面=custom/server/kanban/kanban-status.ts）。v1 用的是旧列
# 模型的 in_progress/verify，均不在九态内，导致三条规则全部恒不命中——已按真实列重写
# 两条、第三条置 retired。漂移由 __tests__/kanban-status-contract.test.ts 拦截。
families:
  - family_id: hf-delivery
    description: 交付列流转的交接契约族（待办→就绪→评审）
    rules:
      # v1 键为 to: in_progress。九态无该列，实际流转是 ready（具备派发资格）→running。
      - rule_id: todo-to-ready-scope
        from: todo
        to: ready
        trigger: 任务从待办进入实现
        instruction: 交接必须说明本次改动面与验收口径；没有验收口径不进入实现
        required_evidence: [scope, acceptance_criteria]
        verification: 接收方先复述改动面与验收口径，不一致先澄清再动手
        fallback: 缺项退回待办补齐，不进入实现
        version: 2
        status: active

      # v1 键为 from: in_progress。同上，实现阶段的看板列是 running→review。
      - rule_id: ready-to-review-evidence
        from: ready
        to: review
        trigger: 实现完成进入评审
        instruction: 交接必须带改动文件清单、复现命令与未验证项；无证据的完成声明不成立
        required_evidence: [changed_files, repro_command, not_verified]
        verification: 评审方先核对三项证据，再给 verdict；缺证据不进入结论
        fallback: 缺项退回实现方补齐，不进入评审结论
        version: 2
        status: active

      # 原 review→verify-regression。九态无 verify 列，且把复测并入 review 会改变
      # review 进入时的派发步数（行为变更），不在缺陷修复批内猜测。保留历史与证据要求。
      # 台账见 docs/superpowers/specs/2026-11-19-kanban-process-baseline.md 决策 D4。
      - rule_id: review-to-verify-regression
        from: review
        to: verify
        trigger: 评审通过进入复测
        instruction: 交接必须带评审判词、测试证据与残余风险；口头“已通过”不构成证据
        required_evidence: [review_verdict, test_evidence, residual_risks]
        verification: 复测方按评审判词逐项复跑，复跑结果与证据对不上即退回
        fallback: 缺项退回评审方补齐，不进入复测
        version: 2
        status: retired

      # v3（批二，2026-11-19）：verify 意图收口——原「复测」证据契约在打回返工流转上
      # 存活。review→ready 是九态内真实可达且会触发列编排（ready entry → implement
      # step）的返工流转，交接行随派单注入（advisory）。「自动复测派发」维持退役
      # （并入 review 步骤会改变进入列派发步数，行为变更不猜；新增板列待产品裁决）。
      # 台账见 docs/superpowers/specs/2026-11-19-process-decoupling-batch2.md 决策 D5。
      - rule_id: review-to-ready-rework
        from: review
        to: ready
        trigger: 评审打回返工重做
        instruction: 返工交接必须带评审判词、失败证据与残余风险；口头“打回”不构成返工依据
        required_evidence: [review_verdict, test_evidence, residual_risks]
        verification: 返工方按判词逐项修复，修复后逐条回执对应证据；对不上再退回评审
        fallback: 缺项退回评审方补齐判词与证据，不进入返工
        version: 1
        status: active

