#   shared/research/20261105-org-rewrite-fusion/FUSION-VERDICT-20261105.md §4 L2 行
#   机制源文: 硅基物种宣言《组织重写》系列 +《生成未来》系列（batch-A/B 存档）
# 落地纪律: 本节只追加，既有键零改动（diff 仅新增）；
#   转述的外部运营数据不入正文（裁决 §4.2 隔离声明）；
