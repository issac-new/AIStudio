    - {task: t_5b257a44, tier: T3, why: '儿童档案下发类卡——命中「儿童相关外发」trigger 一律 T3 必过家长人审（该卡当前 blocked 待人审即 T3 形态；多租户通则，不锚定任何具体家庭）'}

