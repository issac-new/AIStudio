shared_config:
  agent:
    environment_probe: false
    max_turns: 90
    parallel_tool_call_guidance: true
    reasoning_effort: ultra
    task_completion_guidance: true
    tool_use_enforcement: auto
  approvals:
    mode: 'off'
  auxiliary:
    approval:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    background_review:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    compression:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    goal_judge:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    kanban_decomposer:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    moa_aggregator:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    moa_reference:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    profile_describer:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    session_search:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    title_generation:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    triage_specifier:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    vision:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
    web_extract:
      model: glm-5.3-flash
      provider: custom:cc-switch-route
  compression:
    enabled: true
    target_ratio: 0.15
    threshold: 0.35
  custom_providers:
  - api_key: ${MOA_MGLM_API_KEY}
    api_mode: anthropic_messages
    base_url: https://open.bigmodel.cn/api/anthropic
    context_length: 1003520
    models:
      glm-5.3:
        name: glm-5.3
      glm-5.3-flash:
        name: glm-5.3-flash
    name: moa-mglm
  - api_key: ${MOA_MK256_API_KEY}
    api_mode: anthropic_messages
    base_url: https://api.kimi.com/coding
    context_length: 1048576
    models:
      k3:
        name: k3
    name: moa-mk256
  - api_key: ${MOA_MIMO_API_KEY}
    api_mode: anthropic_messages
    base_url: https://token-plan-cn.xiaomimimo.com/anthropic
    context_length: 1048576
    models:
      mimo-v2.6-pro:
        name: mimo-v2.6-pro
    name: moa-mimo
  - name: moa-stepfun
    base_url: https://api.stepfun.com/step_plan
    api_key: ${MOA_STEPFUN_API_KEY}
    api_mode: anthropic_messages
    context_length: 1048576
    models:
      step-5-preview:
        name: step-5-preview
    extra_body:
      output_config:
        effort: high
  - name: moa-minimax
    base_url: https://api.minimax.cn/anthropic
    api_key: ${MOA_MINIMAX_API_KEY}
    api_mode: anthropic_messages
    context_length: 1048576
    models:
      MiniMax-M3:
        name: MiniMax-M3
    extra_body:
      thinking:
        type: adaptive
  - name: moa-deepseek
    base_url: https://api.deepseek.com/anthropic
    api_key: ${MOA_DEEPSEEK_API_KEY}
    api_mode: anthropic_messages
    context_length: 128000
    models:
      deepseek-v4-pro:
        name: deepseek-v4-pro
    extra_body:
      output_config:
        effort: max
  - name: cc-switch-route
    base_url: http://127.0.0.1:15721/hermes/v1
    api_key: ${CC_SWITCH_ROUTE_API_KEY}
    api_mode: codex_responses
    session_affinity_header: session_id
    models:
      glm-5.3:
        context_length: 1048576
      glm-5.3-flash:
        context_length: 1048576
    model: glm-5.3
  - name: cc-switch
    base_url: http://127.0.0.1:15721
    api_key: ${CC_SWITCH_API_KEY}
    api_mode: anthropic_messages
    context_length: 1048576
    models:
      aim:
        name: aim
      glm-5.3:
        name: glm-5.3
      glm-5.3-flash:
        name: glm-5.3-flash
      claude-opus-5:
        name: claude-opus-5
  display:
    language: zh
    skin: daylight
  kanban:
    auto_decompose: false
    board_concurrency: 5
    dispatch_in_gateway: true
    dispatch_interval_seconds: 60
    failure_limit: 2
    max_in_progress: 8
    max_in_progress_per_profile: 5
    orchestrator_profile: orchestrator
  memory:
    memory_enabled: true
    provider: hindsight
    user_profile_enabled: true
  model:
    default: glm-5.3
    provider: cc-switch-route
  privacy:
    redact_pii: true
  security:
    redact_secrets: true
    tirith_enabled: true
  terminal:
    backend: local
    cwd: ~/hermes-docker-sandbox/workspace
    persistent_shell: true
    timeout: 180
