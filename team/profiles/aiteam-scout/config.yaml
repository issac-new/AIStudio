model:
  default: glm-5.3
  provider: cc-switch-route
providers: {}
custom_providers:
- name: cc-switch-route
  base_url: http://127.0.0.1:15721/hermes/v1
  api_key: PROXY_MANAGED
  api_mode: codex_responses
  session_affinity_header: session_id
  models:
    glm-5.3:
      context_length: 1048576
  model: glm-5.3
- name: cc-switch
  base_url: http://127.0.0.1:15721
  api_key: PROXY_MANAGED
  api_mode: anthropic_messages
  context_length: 1048576
  models:
    aim:
      name: aim
    glm-5.3:
      name: glm-5.3
    glm-5.3-flash:
      name: glm-5.3-flash
    claude-opus-5:
      name: claude-opus-5
toolsets:
  - hermes-cli
  - kanban
  - memory
agent:
  environment_probe: false
  max_turns: 90
  parallel_tool_call_guidance: true
  reasoning_effort: ultra
  task_completion_guidance: true
  tool_use_enforcement: auto
  environment_hint: ~/.hermes/profiles/aiteam-scout/SOUL.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  persistent_shell: true
  timeout: 180
compression:
  enabled: true
  target_ratio: 0.15
  threshold: 0.35
memory:
  memory_enabled: true
  provider: hindsight
  user_profile_enabled: true
kanban:
  auto_decompose: false
  board_concurrency: 5
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress: 8
  max_in_progress_per_profile: 5
  orchestrator_profile: orchestrator
  default_assignee: aiteam-scout
display:
  language: zh
  skin: daylight
security:
  redact_secrets: true
  tirith_enabled: true
privacy:
  redact_pii: true
approvals:
  mode: "off"
auxiliary:
  approval:
    provider: auto
  background_review:
    provider: auto
  compression:
    provider: auto
  goal_judge:
    provider: auto
  kanban_decomposer:
    provider: auto
  moa_aggregator:
    provider: auto
  moa_reference:
    provider: auto
  profile_describer:
    provider: auto
  session_search:
    provider: auto
  title_generation:
    provider: auto
  triage_specifier:
    provider: auto
  vision:
    provider: auto
  web_extract:
    provider: auto
fallback_providers: []
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
plugins:
  disabled: []
  enabled:
    - acp-client
    - hindsight
    - memtensor
    - observability/langfuse
    - run-trace
extra:
  skills_enabled_by_category:
    - research
    - software-development
  skills_pinned:
    - skill-recall
skills:
  disabled:
    - hermes-agent-precommit-hygiene
    - ui-craft
mcp_servers:
  ekko-studio-api:
    command: /usr/local/bin/node
    args:
      - /Users/YOURNAME/lab/AIStudio/vendor/hermes-studio/bin/ekko-studio-mcp.mjs
      - api
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8647
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: aiteam-scout
      HERMES_MCP_SERVER_NAME: ekko-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_MCP_USER_CLARIFICATION: '0'
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  ekko-studio-browser:
    command: /usr/local/bin/node
    args:
      - /Users/YOURNAME/lab/AIStudio/vendor/hermes-studio/bin/ekko-studio-mcp.mjs
      - browser
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8647
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: aiteam-scout
      HERMES_MCP_SERVER_NAME: ekko-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_MCP_USER_CLARIFICATION: '0'
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  ekko-studio-use:
    command: /usr/local/bin/node
    args:
      - /Users/YOURNAME/lab/AIStudio/vendor/hermes-studio/bin/ekko-studio-mcp.mjs
      - use
    timeout: 1860
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8647
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: aiteam-scout
      HERMES_MCP_SERVER_NAME: ekko-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_MCP_USER_CLARIFICATION: '0'
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  ekko-studio-interaction:
    command: /usr/local/bin/node
    args:
      - /Users/YOURNAME/lab/AIStudio/vendor/hermes-studio/bin/ekko-studio-mcp.mjs
      - plan
    env:
      ELECTRON_RUN_AS_NODE: '1'
      HERMES_WEB_UI_URL: http://127.0.0.1:8647
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_PROFILE: aiteam-scout
      HERMES_MCP_SERVER_NAME: ekko-studio-interaction
      HERMES_MCP_TOOLSET: plan
      HERMES_MCP_USER_CLARIFICATION: '0'
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 51
clearances:
  - TLP:GREEN
  - TLP:CLEAR
  - EYES-ONLY:aiteam
_left_core_installed:
  - langfuse
