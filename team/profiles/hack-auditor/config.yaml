model:
  default: glm-5.3
  provider: cc-switch-route
providers: {}
custom_providers:
- name: cc-switch-route
  base_url: http://127.0.0.1:15721/hermes/v1
  api_key: PROXY_MANAGED
  api_mode: codex_responses
  session_affinity_header: session_id
  models:
    glm-5.3:
      context_length: 1048576
  model: glm-5.3
toolsets:
- hermes-cli
- kanban
- memory
agent:
  environment_probe: false
  max_turns: 90
  parallel_tool_call_guidance: true
  reasoning_effort: ultra
  task_completion_guidance: true
  tool_use_enforcement: auto
  environment_hint: ~/.hermes/profiles/hack-auditor/SOUL.md
terminal:
  backend: local
  cwd: ~/hermes-docker-sandbox/workspace
  persistent_shell: true
  timeout: 180
compression:
  enabled: true
  target_ratio: 0.15
  threshold: 0.35
memory:
  memory_enabled: true
  provider: hindsight
  user_profile_enabled: true
kanban:
  auto_decompose: false
  board_concurrency: 5
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  failure_limit: 2
  max_in_progress: 8
  max_in_progress_per_profile: 5
  orchestrator_profile: orchestrator
  default_assignee: hack-auditor
display:
  language: zh
  skin: daylight
security:
  redact_secrets: true
  tirith_enabled: true
privacy:
  redact_pii: true
approvals:
  mode: 'off'
auxiliary:
  approval:
    provider: auto
  background_review:
    provider: auto
  compression:
    provider: auto
  goal_judge:
    provider: auto
  kanban_decomposer:
    provider: auto
  moa_aggregator:
    provider: auto
  moa_reference:
    provider: auto
  profile_describer:
    provider: auto
  session_search:
    provider: auto
  title_generation:
    provider: auto
  triage_specifier:
    provider: auto
  vision:
    provider: auto
  web_extract:
    provider: auto
fallback_providers: []
platforms:
  api_server:
    enabled: false
  matrix:
    enabled: false
plugins:
  disabled: []
  enabled:
  - acp-client
  - hindsight
  - observability/langfuse
  - run-trace
extra:
  skills_enabled_by_category:
  - software-development
  - devops
  - github
  - research
  - cybersecurity
  - autonomous-ai-agents
  - note-taking
  - productivity
  - hack-team
  skills_pinned:
  - skill-recall
  - cognition-lattice
  - computer-use
  - wechat-article-extractor
  - wechat-article-search
  - hack-team
mcp_servers:
  ekko-studio-api:
    args:
    - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
    - api
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: hack-auditor
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  ekko-studio-browser:
    args:
    - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
    - browser
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: hack-auditor
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
  ekko-studio-use:
    args:
    - /Applications/SwarmStudio.app/Contents/Resources/webui/bin/hermes-studio-mcp.mjs
    - use
    command: /Users/YOURNAME/.hermes-web-ui/desktop-runtime/hermes/0.20.4/mac-arm64/node/bin/node
    enabled: false
    env:
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEBUI_STATE_DIR: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_HOME: /Users/YOURNAME/.hermes-web-ui
      HERMES_WEB_UI_MANAGED_MCP: '1'
      HERMES_WEB_UI_PROFILE: hack-auditor
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
    timeout: 1860
  rea:
    command: /Users/YOURNAME/lab/tools/rea-mcp-wrapper.sh
    args:
    - mcp
    enabled: true
    env:
      GHIDRA_INSTALL_DIR: /Users/YOURNAME/lab/tools/ghidra_12.1.4_PUBLIC
      JAVA_HOME: /Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 51
clearances:
- TLP:AMBER
- TLP:GREEN
- TLP:CLEAR
_left_core_installed:
- langfuse
