    - homeassistant
onboarding:
  profile_build: ask
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
    tool_progress_prompt: true
updates:
  backup_keep: 5
  non_interactive_local_changes: stash
  pre_update_backup: false
_config_version: 51
clearances:
  - TLP:RED
  - TLP:AMBER
  - TLP:GREEN
  - TLP:CLEAR
  - PII
  - CONFIDENTIAL
moa:
  presets:
    heavy:
      reference_models:
        - provider: custom:moa-mglm
          model: glm-5.3
          enabled: true
        - provider: custom:moa-mk256
          model: k3
          enabled: true
          reasoning_effort: max
        - provider: custom:moa-mimo
          model: mimo-v2.6-pro
          enabled: true
        - provider: custom:moa-stepfun
          model: step-5-preview
          enabled: true
        - provider: custom:moa-minimax
          model: MiniMax-M3
          enabled: true
        - provider: custom:moa-deepseek
          model: deepseek-v4-pro
          enabled: true
      aggregator:
        provider: custom:moa-mglm
        model: glm-5.3-flash
        reasoning_effort: none
      fanout: user_turn
      degraded_reference_policy: loud
  default_preset: heavy
  active_preset: ''
_left_core_installed:
  - homeassistant
  - langfuse
  - spotify
_left_core_scoped:
  - homeassistant
hooks:
  on_session_start:
    - command: '''/Users/YOURNAME/.hermes/profiles/orchestrator/hooks/teamai-status-report.sh'''
      timeout: 60
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
