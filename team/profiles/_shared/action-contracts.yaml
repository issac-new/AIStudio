  # --- Studio 浏览器工具（MCP 服务 ekko-studio-browser，以 toolset=browser 启动）---
  # 快照、读文本、截图、等待、网络与控制台日志为只读；标签页操作与下载到内存可撤销；
  # 打开网址会向外部站点发请求、点击输入会上屏操作、上传会把本机文件交给网页，标为不可逆。
  mcp__ekko_studio_browser__ekko_studio_browser_tabs:
    side_effects: browser_action
    reversible: true
    level: local_reversible
    note: 列出、新建、激活、关闭、释放内嵌浏览器的标签页
  mcp__ekko_studio_browser__ekko_studio_browser_navigate:
    side_effects: browser_action
    reversible: false
    level: shared_state
    note: 打开网址或页内前进、后退、刷新、停止；打开网址会向外部站点发请求
  mcp__ekko_studio_browser__ekko_studio_browser_snapshot:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 只读页面无障碍快照
  mcp__ekko_studio_browser__ekko_studio_browser_read_text:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 只读页面文本
  mcp__ekko_studio_browser__ekko_studio_browser_interact:
    side_effects: browser_action
    reversible: false
    level: shared_state
    note: 在页面上点击、输入、拖拽,可能提交表单或对外发内容
  mcp__ekko_studio_browser__ekko_studio_browser_batch:
    side_effects: browser_action
    reversible: false
    level: shared_state
    note: 一次执行 1-50 个页面交互动作
  mcp__ekko_studio_browser__ekko_studio_browser_screenshot:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 只读页面截图
  mcp__ekko_studio_browser__ekko_studio_browser_upload:
    side_effects: data_egress
    reversible: false
    level: high_risk
    note: 把本机文件内容交给网页,数据外流
  mcp__ekko_studio_browser__ekko_studio_browser_download:
    side_effects: data_ingress
    reversible: true
    level: local_reversible
    note: 下载文件到 Desktop 内存,不落盘
  mcp__ekko_studio_browser__ekko_studio_browser_wait:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 只读等待页面文本出现或消失
  mcp__ekko_studio_browser__ekko_studio_browser_dialog:
    side_effects: browser_action
    reversible: false
    level: shared_state
    note: 回应页面的提示或确认弹窗
  mcp__ekko_studio_browser__ekko_studio_browser_network:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 读或清除一段有界网络日志缓存
  mcp__ekko_studio_browser__ekko_studio_browser_console:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 读或清除一段有界控制台日志缓存
  # --- Studio 接口工具（MCP 服务 ekko-studio-api，以 toolset=api 启动）---
  # 读接口文档为只读。通用接口调用没有接口白名单：方法与路径由模型给出，校验只验接口在文档里、
  # 必填参数齐。放行它等于可经它删除会话、修改供应商、起运行——这是用户选做法 A 时知悉的后果；
  # 给它加接口白名单属于产品改动，不在登记范围。
  mcp__ekko_studio_api__ekko_studio_api_openapi_get:
    side_effects: none
    reversible: NA
    level: local_reversible
    note: 只读接口文档
  mcp__ekko_studio_api__ekko_studio_api_request:
    side_effects: external_call
    reversible: false
    level: high_risk
    note: 调用任意 Studio 接口；没有接口白名单，经它可删会话、改供应商、起运行
tool_mapping:
  browser_navigate:
  - browser_exec
  - computer_use
  - cua_browser_navigate
  browser_click:
  - browser_exec
  - computer_use
  - cua_browser_click
  browser_type:
  - browser_exec
  - computer_use
  - cua_browser_type
  cronjob:
  - cronjob_manage
  todo_list:
  - todo
  process_manage:
  - process
  gui_tour:
  - tour
  show_tip:
  - tip
arg_contracts:
  cronjob:
    when_action: create
    required_args:
    - schedule
    - prompt
  computer_use:
    enum_args:
      action:
      - capture
      - click
      - double_click
      - right_click
      - middle_click
      - drag
      - scroll
      - type
      - key
      - set_value
      - wait
      - list_apps
      - list_windows
      - focus_app
      - cua_browser_state
      - cua_browser_prepare
      - cua_browser_navigate
      - cua_browser_click
      - cua_browser_type
      - cua_browser_pointer
      - cua_browser_dialog
      - cua_browser_set_input_files
      - cua_browser_download
  execute_code:
    required_args:
    - code
  delegate_task:
    required_args:
    - goal
  acp_send:
    required_args:
    - prompt
  memory:
    required_args:
    - target
terminal_blacklist:
- \brm\s+(-[a-zA-Z]*f[a-zA-Z]*\s+)?(-[a-zA-Z]*r[a-zA-Z]*\s+)*/(\s|$|;|&)
- \brm\s+-[a-zA-Z]*\s*/\s*\*
- \bmkfs(\.[a-z0-9]+)?\s
- \bdd\s+.*\bif=\S+\s+.*\bof=/dev/
- ':\(\)\s*\{\s*:\|:\s*&\s*\}\s*;?:'
- \bgit\s+push\s+.*--force.*\b(main|master|release|protected)\b
- \bgit\s+push\s+(-f|--force)\b
- \b(shutdown|reboot|halt|poweroff)\b
